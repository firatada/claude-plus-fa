<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Panel</title>
<!-- The Agent Panel's face, shown by agent-panel.pyw in a WebView2 window. Spark tokens
     (mindmap/design_themes/spark_theme). Dots: working and open are green, closed is grey;
     a working card breathes green slowly, a card whose prompt waits for an answer pulses red, faster
     (the maintainer, 2026-11-09). The folder path shows only in the title's tooltip.
     Mascot (2026-11-09): a purple octopus (the maintainer's sheet, cut by tools/mascot-export.py into
     mascot/ and inlined by agent-panel.pyw as window.MASCOT). It is the header's logo and sits on every
     card: reading a tablet while the session works, puzzled with a question mark while it asks, calm and
     blinking now and then while it is open, asleep and still when closed, and on a card takes its
     state's dot colour (green, red, grey; the strips are recoloured at export); the header's stays purple. Without the strips the old logo stays. The bars' 50-80 % band is gold to match the status line,
     an exception to Spark's "gold for rewards only". Written-down exceptions to design.md "One row,
     one shape": the header's logo (36, the octopus), count pill (18, pill radius) and hide button (26) differ, the
     pill qualifying the title and the button standing apart at the edge. Headings and boxes share the
     16 px edge; card text sits inside its card.
     Top dock (2026-11-10, the maintainer): the same page as a strip over the top edge (body.top): a grip,
     the octopus and the count, the search, the cards as one row of tabs (the ones that do not fit are not shown), the
     set-aside link opening its section as a list under the strip (#drop), the usage bars, the hide
     button. The window is taller than the strip; agent-panel.pyw clips it to the strip plus whatever is
     open under it (menus, tooltips, messages, #drop), which this page reports every frame (syncRegion).
     The header (the grip on top) drags the panel between the two docks. -->
<style>
:root {
  --bg: #f4f6fb; --panel: #ffffff; --surface2: #eef2fb; --line: #e2e8f5; --text: #0a1a40; --muted: #4b5672;
  --faint: #687189;          /* quiet text, still 4.5:1 on --bg */
  --gone: #8a93a8;           /* the closed dot, 3:1 on white */
  --blue: #1b4df5; --green: #16a34a; --gold: #f5a623; --red: #e11d48; --on-accent: #ffffff;
  --red-deep: #be123c; --red-tint: #fde8ec; --green-tint: #e7f6ec; --amber-tint: #fff7e6; --amber-line: #f5d9a8; --hit: #dbe4ff; --thumb: #d5dcea; --thumb-hover: #b5bdd0;
  --ring: 0 0 0 3px rgba(27, 77, 245, .12);
  --shadow: 0 10px 30px rgba(10, 26, 64, .08);
  --shadow-pop: 0 10px 30px rgba(10, 26, 64, .16); --shadow-tip: 0 6px 16px rgba(10, 26, 64, .2);
  --glow: 0 4px 14px rgba(27, 77, 245, .35); --glow-red: 0 4px 14px rgba(225, 29, 72, .35);
  --tip-bg: rgba(10, 26, 64, .88);
  --r-card: 14px; --r-ctl: 10px; --r-pill: 20px; --r-small: 6px;
  --edge: 16px;              /* every box and every heading starts here */
  --ease: cubic-bezier(.23, 1, .32, 1);
  --strip: 46px;             /* the top dock's height: agent-panel.pyw STRIP */
  --tab: 34px;               /* the top dock's tabs and controls, centred in the strip (6 px above and below) */
  --card-shadow: var(--shadow);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 400 12px/1.35 "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden; user-select: none; cursor: default;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

header { flex: none; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 var(--edge); cursor: grab; }
header button { cursor: pointer; }
body.dragging, body.dragging * { cursor: grabbing !important; }
#grip { display: none; flex: none; color: var(--faint); }
.logo { flex: none; width: 26px; height: 26px; }
/* a mascot strip: its frames side by side, the frame shown picked by background-position */
.mascot { flex: none; background-repeat: no-repeat; background-position: 0 0; }
.mascot[hidden] { display: none; }
.logo.mascot { width: 36px; height: 36px; }
.av { width: 38px; height: 38px; align-self: center; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
h1 { font-size: 15px; font-weight: 600; }
#count {
  min-width: 22px; height: 18px; padding: 0 7px; border-radius: var(--r-pill); background: var(--surface2);
  color: var(--muted); font-size: 11px; font-weight: 600; display: grid; place-items: center;
}
#count:empty { visibility: hidden; }
#hide {
  margin-left: auto; min-width: 26px; min-height: 26px; padding: 0; border: 0; border-radius: var(--r-ctl);
  background: none; color: var(--muted); display: grid; place-items: center;
}
#hide:hover { color: var(--blue); background: var(--surface2); }

.search {
  flex: none; margin: 2px var(--edge) 12px; min-height: 32px; display: flex; align-items: center; gap: 8px;
  padding: 0 6px 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-ctl);
  cursor: text;
}
.search:focus-within { border-color: var(--blue); box-shadow: var(--ring); }
.search > svg { flex: none; color: var(--muted); }
#q { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--text); }
#q::placeholder { color: var(--faint); }
#q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
#qx {
  flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: var(--r-small); background: none;
  color: var(--muted); display: grid; place-items: center;
}
#qx[hidden] { display: none; }
#qx:hover { color: var(--blue); background: var(--surface2); }

#list {
  position: relative; flex: 1; overflow-y: auto; padding: 4px 8px 8px var(--edge); scrollbar-gutter: stable;
}
#list::-webkit-scrollbar { width: 8px; }
#list::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 4px; border: 2px solid var(--bg); }
#list::-webkit-scrollbar-thumb:hover { background: var(--thumb-hover); }

.card {
  height: 56px; margin-bottom: 8px; padding: 9px 14px 9px 8px; display: flex; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--card-shadow);
  transition: transform .16s ease-out;
}
/* only a card that does something on a click reacts to the pointer */
.card.here { cursor: pointer; }
.card.here:hover, .card.target { border-color: var(--blue); box-shadow: var(--card-shadow), 0 0 0 .5px var(--blue); }
.card.here:active { transform: scale(.98); }
.card:focus-visible { outline-offset: 1px; }
.t { display: flex; align-items: center; gap: 6px; height: 18px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--gone); }
.dot.busy { background: var(--green); }
.dot.ask { background: var(--red); }
/* the whole card shows the state: working breathes green slowly for as long as Claude reports the
   session busy; a prompt in it waiting for an answer pulses red, faster, the family's "this needs you".
   Background and ring only, so the hover's blue border still shows over it. */
.card.busy { animation: breathe 2.4s ease-in-out infinite; }
.card.ask { animation: alarm 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { background: var(--green-tint); box-shadow: var(--card-shadow), 0 0 0 1.5px var(--green); } }
@keyframes alarm { 50% { background: var(--red-tint); box-shadow: var(--card-shadow), 0 0 0 2px var(--red); } }
.dot.idle { background: var(--green); }
.name { min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arrow { flex: none; visibility: hidden; color: var(--blue); font-size: 12px; }
.card.here:hover .arrow { visibility: visible; }
.age { flex: none; margin-left: auto; font-size: 11px; color: var(--muted); }
/* background work of an open session (child runs, subagents): a quiet count with a turning arc, gone when
   they end; the list of them is its tooltip */
.bgw {
  flex: none; margin-left: auto; height: 16px; padding: 0 5px; display: inline-flex; align-items: center; gap: 3px;
  border-radius: var(--r-small); background: var(--surface2); color: var(--muted); font-size: 11px; font-weight: 600;
}
.bgw[hidden] { display: none; }
.bgw:not([hidden]) + .age { margin-left: 0; }
.bgw svg { flex: none; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.meta { padding-left: 14px; height: 16px; font-size: 11px; color: var(--muted); }
.meta { display: flex; align-items: center; gap: 6px; }
.meta > span { flex: none; }
.meta > [hidden] { display: none; }
.meta > .flags { flex: 0 1 auto; min-width: 0; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { flex: none; width: 56px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
mark { background: var(--hit); color: inherit; border-radius: 2px; }

.card.sk { pointer-events: none; }
.bar.sk { animation: sk 1.4s ease-in-out infinite; }
.sk i { display: block; height: 9px; margin: 4px 0; border-radius: 4px; background: var(--surface2);
        animation: sk 1.4s ease-in-out infinite; }
@keyframes sk { 50% { opacity: .45; } }

.sect { margin: 18px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.empty { padding: 30px 14px 0; color: var(--muted); }
.empty button { display: block; margin-top: 6px; padding: 0; border: 0; background: none; color: var(--blue); font-size: 12px; }
.empty button:hover { text-decoration: underline; }
.empty button, .item, #hide, #qx { transition: transform .16s ease-out; }

/* a message about one card, just under it; it scrolls with its card */
.say {
  position: absolute; z-index: 5; padding: 6px 10px; border-radius: var(--r-ctl); background: var(--panel);
  border: 1px solid var(--line); box-shadow: var(--shadow-pop); font-size: 11px; color: var(--text);
  animation: drop .16s var(--ease);
}
.say.err { color: var(--red); border-color: var(--red-tint); }
.say::before {
  content: ""; position: absolute; left: 22px; top: -5px; width: 8px; height: 8px; background: inherit;
  border: inherit; border-right: 0; border-bottom: 0; transform: rotate(45deg);
}
.say.up { animation-name: rise; }
.say.up::before { top: auto; bottom: -5px; transform: rotate(225deg); }

/* the set-aside section fades down into place when it is shown */
.enter { animation: drop .16s var(--ease); }

#bottom { flex: none; }
/* a message about the whole panel, at the foot of the list: the list gives up the room, so it covers no card
   and the link and usage rows below it stay where they are */
#note {
  margin: 8px var(--edge) 0; padding: 6px 10px; border-radius: var(--r-ctl);
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-pop); font-size: 11px;
  animation: rise .16s var(--ease);
}
#note:empty { display: none; }
#note.err { color: var(--red); border-color: var(--red-tint); }
/* a standing fact about the whole panel, not a failure of something the reader did */
#note.warn { color: var(--text); background: var(--amber-tint); border-color: var(--amber-line); }
#footer {
  display: block; min-height: 15px; margin: 10px var(--edge); padding: 0; border: 0; background: none;
  font-size: 11px; color: var(--faint); text-align: left;
}
#footer:hover { color: var(--blue); text-decoration: underline; }
#footer:empty { visibility: hidden; }
#usage { margin: 0 var(--edge); padding: 8px 0 10px; border-top: 1px solid var(--line); }
.u { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; height: 22px;
     font-size: 11px; color: var(--muted); }
.u .bar { width: auto; }
.u span:last-child { white-space: pre; text-align: right; min-width: 92px; }

.pop {
  position: fixed; z-index: 10; padding: 6px; min-width: 150px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-pop);
  animation: drop .16s var(--ease);
}
.pop { transform-origin: top left; }
.pop.up { animation-name: rise; transform-origin: bottom left; }
/* opened from the keyboard: there, at once */
.pop.now { animation: none; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.item {
  display: block; width: 100%; min-height: 32px; padding: 4px 10px; text-align: left; border: 0;
  border-radius: var(--r-ctl); background: none; color: var(--text);
}
.item:hover { background: var(--surface2); }
.item:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--blue); }
.item.danger { color: var(--red); }
.item.danger:hover { background: var(--red-tint); color: var(--red-deep); }
.item[aria-disabled="true"] { color: var(--faint); cursor: default; }
.item[aria-disabled="true"]:hover { background: none; }
.why { padding: 2px 10px 6px; font-size: 11px; color: var(--red); animation: drop .16s var(--ease); }
.sep { height: 1px; margin: 4px 6px; background: var(--line); }
.confirm { width: 232px; padding: 8px 8px 4px; }
.confirm h2 { margin-bottom: 4px; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.confirm p { margin-bottom: 12px; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn {
  min-height: 30px; padding: 4px 14px; border: 1px solid var(--line); border-radius: var(--r-ctl);
  background: var(--panel); color: var(--text); font-weight: 600; transition: transform .16s ease-out;
}
.btn:hover { background: var(--surface2); }
.btn.go { background: var(--blue); border-color: var(--blue); color: var(--on-accent); box-shadow: var(--glow); }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--on-accent); box-shadow: var(--glow-red); }
.btn.go:hover, .btn.danger:hover { filter: brightness(1.08); }
.btn:active, .item:active, #hide:active, #qx:active, #footer:active, .empty button:active { transform: scale(.97); }
#footer { transition: transform .16s ease-out; }

.tip {
  position: fixed; z-index: 20; max-width: calc(100vw - 16px); padding: 5px 8px; border-radius: var(--r-small);
  background: var(--tip-bg); color: var(--on-accent); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere;
  pointer-events: none; box-shadow: var(--shadow-tip); animation: fade .12s ease-out;
}
@keyframes fade { from { opacity: 0; } }
/* a figure that changed fades in rather than snapping */
.chg { animation: chg .2s ease-out; }
@keyframes chg { from { opacity: 0; filter: blur(3px); } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card.here:active, .btn:active, .item:active, #hide:active, #qx:active, #footer:active { transform: none; }
  /* without the blink, each state still differs by shape, not by colour alone */
  .dot.busy { background: transparent; box-shadow: inset 0 0 0 2px var(--green); }
  .dot.ask { box-shadow: 0 0 0 2px var(--red-tint); }
  /* the card keeps its state as a still tint instead of breathing */
  .card.busy { background: var(--green-tint); box-shadow: var(--card-shadow), 0 0 0 1.5px var(--green); }
  .card.ask { background: var(--red-tint); box-shadow: var(--card-shadow), 0 0 0 2px var(--red); }
}

/* ----- the top dock: one strip, --strip high, over the top edge ----- */
body.top {
  height: var(--strip); flex-direction: row; align-items: center; gap: 8px; padding: 0 8px 0 10px;
  box-shadow: inset 0 -1px var(--line);
}
body.top header, body.top #bottom { display: contents; }
body.top #grip { display: block; cursor: grab; }
body.top h1 { display: none; }
body.top .logo.mascot { width: 32px; height: 32px; }
body.top svg.logo { width: 28px; height: 28px; }
body.top #hide { margin-left: 0; min-width: var(--tab); min-height: var(--tab); }
body.top .search { margin: 0; flex: 0 1 210px; min-width: 120px; min-height: var(--tab); }
/* a narrow screen gives the tabs the room the reset times took */
@media (max-width: 1400px) { body.top .rt { display: none; } }
/* the cards are tabs in one row that never scrolls: the tabs that do not fit wrap onto a second row,
   which the strip clips, and fit() hides them, so a tab shows whole or not at all, newest first.
   The tabs sit as centred as the other controls */
body.top #list {
  flex: 1; min-width: 0; align-self: stretch; display: flex; flex-wrap: wrap; align-items: flex-start;
  align-content: flex-start; gap: var(--strip) 6px; overflow: clip; padding: calc((var(--strip) - var(--tab)) / 2) 4px 0;
}
body.top #list .card.off { visibility: hidden; }
body.top #list .card {
  flex: none; width: 170px; height: var(--tab); margin: 0; padding: 0 10px 0 4px; gap: 6px; align-items: center;
  border-radius: var(--r-ctl); --card-shadow: 0 0 0 0 transparent;
}
body.top #list .card:focus-visible { outline-offset: -2px; }
body.top #list .av { width: 28px; height: 28px; }
body.top #list .body { flex-direction: row; align-items: center; gap: 8px; }
body.top #list .t { flex: 1; min-width: 0; }
body.top #list .name { font-size: 12px; }
body.top #list .age, body.top #list .arrow, body.top #list .cx, body.top #list .flags { display: none; }
/* the octopus already shows the state in its colour; the dot stands in only when there is no octopus */
body.top #list .av:not([hidden]) + .body .dot { display: none; }
body.top #list .meta { flex: none; padding-left: 0; gap: 4px; }
body.top #list .meta .bar { width: 20px; }
body.top #list .card.sk { display: block; padding: 5px 10px; }
body.top #list .sk i { margin: 2px 0 3px; }
body.top .empty { flex: none; align-self: center; display: flex; align-items: center; gap: 10px; padding: 0 6px; white-space: nowrap; }
body.top .empty button { display: inline; margin: 0; }
body.top #footer {
  flex: none; margin: 0; min-height: var(--tab); padding: 0 10px; border-radius: var(--r-ctl); white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
body.top #footer:empty { display: none; }
body.top #footer:hover { text-decoration: none; background: var(--surface2); }
body.top #footer[aria-expanded="true"] { color: var(--blue); background: var(--surface2); }
body.top #usage { flex: none; margin: 0; padding: 0; border: 0; display: flex; gap: 14px; }
body.top .u { grid-template-columns: auto 28px auto; gap: 6px; height: var(--tab); }
body.top .u span:last-child { min-width: 0; }
/* a message about the whole panel, and one about a card, float under the strip */
body.top #note { position: fixed; top: calc(var(--strip) + 6px); right: 16px; max-width: 420px; margin: 0; }
body.top .say { position: fixed; }
body.top .say::before { display: none; }
/* the hidden, deleted and headless sessions: a list under the strip, opened by its link */
#drop { display: none; }
body.top #drop.open {
  display: block; position: fixed; z-index: 4; top: calc(var(--strip) + 6px); width: 300px; max-height: 400px;
  overflow-y: auto; padding: 0 8px 0 12px; background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r-card); animation: drop .16s var(--ease); transform-origin: top right;
}
#drop { padding-top: 8px; }
#drop .card:last-child { margin-bottom: 8px; }
#drop .empty { padding: 12px 2px; white-space: normal; }
</style>
</head>
<body>
<header>
  <svg id="grip" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true" data-tip
    data-full="Drag down to dock the panel on the right"><g fill="currentColor">
    <circle cx="2" cy="2" r="1.3"/><circle cx="6" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/>
    <circle cx="6" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="6" cy="12" r="1.3"/></g></svg>
  <span class="logo mascot" id="me" aria-hidden="true" hidden></span>
  <svg class="logo" id="mark" viewBox="0 0 256 256" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4df5"/><stop offset="1" stop-color="#33c6f4"/></linearGradient></defs>
    <rect width="256" height="256" rx="72" fill="url(#g)"/>
    <g fill="#fff">
      <circle cx="75" cy="78" r="13"/><rect x="104" y="67" width="92" height="22" rx="11"/>
      <circle cx="75" cy="128" r="13"/><rect x="104" y="117" width="74" height="22" rx="11"/>
      <circle cx="75" cy="178" r="13"/><rect x="104" y="167" width="56" height="22" rx="11"/>
    </g>
  </svg>
  <h1 data-tip data-full="Drag to the top edge to dock the panel there">Agent Panel</h1>
  <span id="count" data-tip data-full="Sessions in the main list"></span>
  <button id="hide" aria-label="Hide the panel (Ctrl+Alt+C)" data-tip data-full="Hide the panel (Ctrl+Alt+C)">
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</header>
<label class="search">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.6"/><path d="M10 10l3.8 3.8"/></svg>
  <input id="q" type="search" name="agent-panel-search" aria-label="Search sessions"
    placeholder="Search titles and folders…" spellcheck="false" autocomplete="off" autocorrect="off"
    autocapitalize="off" data-1p-ignore data-lpignore="true" data-form-type="other">
  <button id="qx" type="button" tabindex="-1" aria-label="Clear search" data-tip data-full="Clear the search (Esc)" hidden>
    <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</label>
<div id="list"></div>
<div id="bottom">
  <div id="note"></div>
  <button id="footer" type="button" data-tip data-full="Lists the sessions kept out of the main list"></button>
  <div id="usage"></div>
</div>
<div id="drop" role="region" aria-label="Hidden, deleted and headless sessions"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>

<script>window.MASCOT = window.MASCOT || {}; /*MASCOT*/</script>
<script>
const $ = id => document.getElementById(id);
const api = () => window.pywebview.api;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const still = matchMedia("(prefers-reduced-motion: reduce)");
let state = {sessions: [], limits: {}}, showHidden = false, scrollToAside = false, revealing = false, lastKey = null;
// docked at the top (a strip of tabs) or on the right (the column); agent-panel.pyw sets it at load and on a drag
const onTop = () => document.body.classList.contains("top");

// ----- the mascot (mindmap mascot.md: frame 0 the rest, frame 0 only under reduced motion). The
// octopus sheet's frames are poses, not in-betweens, so each one holds about half a second. -----
const sprites = new Map();   // element -> {key, mode, n, ms, f, at}
// strip, how it plays, its frame count (fixed by tools/mascot-export.py), ms per frame:
// working reads, asking looks puzzled, open blinks now and then, closed sleeps without moving
const MOOD = {busy: ["reading", "loop", 5, 650], ask: ["asking", "loop", 4, 550],
              idle: ["calm", "idle", 5, 450], "": ["sleeping", "still", 3, 0]};
function sprite(el, [key, mode, n, ms]) {
  const src = MASCOT[key];
  el.hidden = !src;
  if (!src) return false;
  const s = sprites.get(el);
  if (s && s.key === key) return true;
  el.style.backgroundImage = `url(${src})`;
  el.style.backgroundSize = n * 100 + "% 100%";
  el.style.backgroundPosition = "0 0";
  // each card starts at its own moment, so the octopuses do not move in step
  sprites.set(el, {key, mode, n, ms, f: 0, at: performance.now() + Math.random() * 1200});
  return true;
}
function tick(now) {
  for (const [el, s] of sprites) {
    if (!el.isConnected) { sprites.delete(el); continue; }
    if (still.matches || s.mode === "still") {
      if (s.f) { s.f = 0; el.style.backgroundPosition = "0 0"; }
      continue;
    }
    if (now < s.at) continue;
    s.f = (s.f + 1) % s.n;
    // idle: one look around, then about 5 s at rest on frame 0
    s.at = now + (s.f === 0 && s.mode === "idle" ? 5000 : s.ms);
    el.style.backgroundPosition = s.f * 100 / (s.n - 1) + "% 0";
  }
  if (onTop()) syncRegion();
  requestAnimationFrame(tick);
}
// On top the window shows only the strip and what is open under it: everything that floats there is
// reported, at its laid-out place and corner radius, whenever it changes
let regionKey = "", bridged = false;
function syncRegion() {
  const rs = [...document.querySelectorAll(".pop, .tip, .say, #note:not(:empty), #drop.open")].map(e => {
    const r = parseFloat(getComputedStyle(e).borderTopLeftRadius) || 0;
    return [e.offsetLeft, e.offsetTop, e.offsetWidth, e.offsetHeight, r].map(Math.round);
  });
  const k = JSON.stringify(rs);
  // pywebview puts an empty window.pywebview.api in place before it adds the methods: calling region()
  // in that gap threw inside the frame loop, which then stopped for good (no menu, list or tooltip
  // could show again, and the octopuses froze), so the bridge is used only once pywebviewready has fired
  if (k === regionKey || !bridged) return;
  regionKey = k;
  api().region(rs);
}
requestAnimationFrame(tick);
// the header's octopus shows the most pressing state in the list
function headerMascot() {
  const st = state.sessions.map(s => !s.status ? "" : s.waiting ? "ask" : s.status === "busy" ? "busy" : "idle");
  const top = st.includes("ask") ? "ask" : st.includes("busy") ? "busy" : "idle";
  // in the octopus's own purple, the strips' "-purple" copies: the cards carry the state colours
  const [key, ...rest] = MOOD[top];
  $("mark").style.display = sprite($("me"), [key + "-purple", ...rest]) ? "none" : "";
}

// hidden by the user, its folder is gone, or a headless `claude -p` run another session started:
// kept out of the main list
const aside = s => s.hidden || !s.here || s.headless;
const STATUS = {ask: "A prompt in it waits for your answer", busy: "Working", idle: "Open, waiting for you", "": "Closed"};

// green under 50 %, gold under 80 %, red above, as on the status line; colour and figure both
// come from the same rounded value, so the two can never disagree
function bar(p) {
  if (p == null) return '<span class="bar"></span>';
  const v = Math.round(Math.max(0, Math.min(100, p)));
  const c = v < 50 ? "var(--green)" : v < 80 ? "var(--gold)" : "var(--red)";
  return `<span class="bar"><i style="width:${v ? `max(6px, ${v}%)` : 0};background:${c}"></i></span>`;
}
const pct = p => Math.round(Math.max(0, Math.min(100, p))) + "%";

// the search hits marked inside a text; left unmarked if lowercasing changed its length
function hit(t, q) {
  const low = t.toLowerCase();
  if (!q || low.length !== t.length) return esc(t);
  let out = "", i = 0, k;
  while ((k = low.indexOf(q, i)) >= 0) {
    out += esc(t.slice(i, k)) + "<mark>" + esc(t.slice(k, k + q.length)) + "</mark>";
    i = k + q.length;
  }
  return out + esc(t.slice(i));
}

// Cards are kept and patched, never redrawn wholesale: open sessions change every 2 s, and a
// redrawn card would drop the pointer's hover and the tooltip on its title.
function fill(el, s, q) {
  const st = !s.status ? "" : s.waiting ? "ask" : s.status === "busy" ? "busy" : "idle";
  el.className = "card" + (st === "busy" || st === "ask" ? " " + st : "") + (s.here ? " here" : "") +
                 (menuFor === s.id ? " target" : "");
  sprite(el.querySelector(".av"), MOOD[st]);
  const d = el.querySelector(".dot");
  d.className = "dot " + st;
  d.dataset.full = STATUS[st];
  d.setAttribute("aria-label", STATUS[st]);
  const n = el.querySelector(".name"), nh = hit(s.title, q);
  if (n.dataset.html !== nh) { n.innerHTML = nh; n.dataset.html = nh; }
  // the folder path lives in the title's tooltip; a title cut short shows there in full above it
  n.dataset.title = s.title;
  n.dataset.path = s.path;
  n.dataset.full = n.classList.contains("cut") ? s.title + "\n" + s.path : s.path;
  const a = el.querySelector(".age");
  a.textContent = s.age;
  a.dataset.k = "age:" + s.id;
  const flags = (s.hidden ? ["hidden"] : []).concat(s.headless ? ["headless"] : [], s.here ? [] : ["folder deleted"]).join(" · ");
  // what the session runs in the background: a count on the title row, each one listed in its tooltip
  const bg = s.bg || [], w = el.querySelector(".bgw");
  w.hidden = !bg.length;
  if (bg.length) {
    w.lastChild.textContent = bg.length;
    w.dataset.full = "Running in the background:\n" + bg.slice(0, 8).map(b =>
      [b.kind, b.what, b.for].filter(Boolean).join(" · ")).join("\n") +
      (bg.length > 8 ? `\nand ${bg.length - 8} more` : "");
  }
  el.setAttribute("aria-label", [s.title, STATUS[st].toLowerCase(), s.path, s.age,
    s.ctx == null ? "" : "context " + pct(s.ctx), flags,
    bg.length ? bg.length + " running in the background" : ""].filter(Boolean).join(", "));
  // the meta row is built once and patched, so a tooltip on it survives the 2 s refresh;
  // a session with no context reading shows no ctx bar at all
  const m = el.querySelector(".meta");
  if (!m.firstChild) m.innerHTML = '<span class="cx" data-tip>ctx</span><span class="bar"><i></i></span>' +
                                   '<span class="pc"></span><span class="flags"></span>';
  const [cx, b, pc, fl] = m.children, has = s.ctx != null;
  [cx, b, pc].forEach(x => { x.hidden = !has; });
  if (has) {
    const v = Math.round(Math.max(0, Math.min(100, s.ctx)));
    cx.dataset.full = `Context used: ${v}% of the window`;
    b.firstChild.style.width = v ? `max(6px, ${v}%)` : "0";
    b.firstChild.style.background = v < 50 ? "var(--green)" : v < 80 ? "var(--gold)" : "var(--red)";
    pc.textContent = v + "%";
    pc.dataset.k = "ctx:" + s.id;
  }
  if (fl.textContent !== flags) { fl.textContent = flags; fl.dataset.full = flags; }
}
function cardEl(s, old, q) {
  let el = old.get(s.id);
  if (!el) {
    el = document.createElement("div");
    el.dataset.id = s.id;
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.innerHTML = '<span class="mascot av" aria-hidden="true" hidden></span><div class="body">' +
                   '<div class="t"><span class="dot" role="img" data-tip></span><span class="name" data-tip></span>' +
                   '<span class="arrow" aria-hidden="true">↗</span><span class="bgw" data-tip hidden>' +
                   '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1a4 4 0 1 1-4 4" fill="none" ' +
                   'stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><b></b></span>' +
                   '<span class="age"></span></div>' +
                   '<div class="meta"></div></div>';
  }
  fill(el, s, q);
  return el;
}
function note(cls, text, id, tag) {
  const el = document.createElement(tag || "div");
  el.className = cls;
  el.textContent = text;
  if (id) el.id = id;
  return el;
}
function skeleton() {
  const el = document.createElement("div");
  el.className = "card sk";
  el.innerHTML = '<i style="width:60%"></i><i style="width:40%"></i>';
  return el;
}

// While the pointer is over the list the cards keep their order, so a click lands on the card that
// was under it; the newest-first order comes back when the pointer leaves. Keyboard focus on a card
// holds it too, but only while the panel window has focus: a click on a card raises another window
// and leaves document.activeElement on that card, which would otherwise freeze the order for hours.
let hovering = false;
const rowsOf = list => [...list.children].filter(e => !e.classList.contains("say"));
// A reorder moves cards (design.md: what moves is animated): each card that stood in the list
// slides from its old place to its new one; a card new to the list, once the list was already
// drawn, fades in from a few pixels above. Under reduced motion the cards simply take their places.
const MOVE = {duration: 260, easing: "cubic-bezier(0.23, 1, 0.32, 1)"};
function glide(els, was) {
  if (still.matches || !was.size) return;
  for (const e of els) {
    if (!e.classList || !e.classList.contains("card")) continue;
    const from = was.get(e);
    if (from === undefined) {
      e.animate([{opacity: 0, transform: "translateY(-4px)"}, {opacity: 1, transform: "none"}], MOVE);
      continue;
    }
    const r = e.getBoundingClientRect(), dx = from.left - r.left, dy = from.top - r.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) e.animate([{transform: `translate(${dx}px, ${dy}px)`}, {transform: "none"}], MOVE);
  }
}

function holdOrder(els, list) {
  const now = rowsOf(list);
  const held = hovering || menu || (document.hasFocus() && list.contains(document.activeElement));
  if (!held || els.length !== now.length || !els.every(e => now.includes(e))) return els;
  return now;
}

function render() {
  headerMascot();
  const q = $("q").value.trim().toLowerCase();
  const all = state.sessions, nAside = all.filter(aside).length, nMain = all.length - nAside;
  const found = all.filter(s => !q || (s.title + "\n" + s.path).toLowerCase().includes(q));
  const rows = found.filter(s => !aside(s)), hits = found.filter(aside);
  if (!nAside) showHidden = false;
  const rest = showHidden ? hits : [];
  $("count").textContent = !state.ready ? "" : q ? `${rows.length}/${nMain}` : nMain;
  $("count").dataset.full = q ? "Matches in the main list / sessions in it" : "Sessions in the main list";
  $("footer").setAttribute("aria-expanded", showHidden);
  $("footer").dataset.full = showHidden ? "Takes those sessions out of the list again" : "Lists the sessions kept out of the main list";
  const nShown = q ? hits.length : nAside;
  // while a search finds nothing set aside, the link would only open an empty section
  // on top the link opens a list under the strip and keeps its words, so the strip does not shift
  $("footer").textContent = !nAside || (q && !hits.length && !showHidden) ? ""
    : onTop() ? `Hidden, Deleted and Headless (${nShown}) ${showHidden ? "▴" : "▾"}`
    : showHidden ? "Fold Hidden, Deleted and Headless" : `Show Hidden, Deleted and Headless (${nShown})`;
  const top = onTop(), key = JSON.stringify([q, rows, rest, state.ready, menuFor, top, showHidden]);
  const list = $("list"), drop = $("drop");
  if (key !== lastKey) {
    lastKey = key;
    const old = new Map([...document.querySelectorAll("#list .card[data-id], #drop .card[data-id]")].map(e => [e.dataset.id, e]));
    let els = rows.map(s => cardEl(s, old, q));
    // the set-aside section follows the main list on the right, and is the list under the strip on top
    // (on top the link that opens the list names it, so the list carries no heading of its own)
    const cards = rest.map(s => cardEl(s, old, q));
    const sect = !rest.length ? [] : top ? cards : [$("sect") || note("sect", "HIDDEN, DELETED AND HEADLESS", "sect", "h2"), ...cards];
    if (!top) els.push(...sect);
    drop.classList.toggle("open", top && showHidden);
    if (top && showHidden) {
      const was = new Set(drop.children);
      drop.replaceChildren(...(sect.length ? sect : [note("empty", "None of them match the search.")]));
      if (!was.size) drop.scrollTop = 0;
    } else if (drop.firstChild) drop.replaceChildren();
    if (!state.ready) els = [skeleton(), skeleton(), skeleton()];
    else if (!els.length) {
      const offAside = !showHidden && (q ? hits.length : nAside);
      const e = note("empty", q ? (offAside ? (hits.length === 1 ? "Nothing in the main list matches; 1 hidden, deleted or headless session does."
                                                         : `Nothing in the main list matches; ${hits.length} hidden, deleted or headless sessions do.`)
                                            : "No sessions match.")
                                : nAside === 1 ? "The only session is hidden, deleted or headless."
                                : nAside ? `All ${nAside} sessions are hidden, deleted or headless.`
                                : state.error ? "Could not read the sessions yet." : "No sessions yet.");
      // the way out of the empty list is offered right where the reader is looking
      if (offAside) e.insertAdjacentHTML("beforeend", '<button type="button" data-a="aside">Show Them</button>');
      els.push(e);
    }
    els = holdOrder(els, list);
    const kids = rowsOf(list);
    const same = els.length === kids.length && els.every((e, i) => e === kids[i]);
    if (!same) {
      const bubble = document.querySelector(".say"), before = new Set(list.children);
      // where each card stood, so a card that changes place glides there instead of jumping
      // (real cards only: the first list after the loading skeletons arrives without motion)
      const was = new Map([...list.querySelectorAll(".card[data-id]")].map(e => [e, e.getBoundingClientRect()]));
      const had = list.contains(document.activeElement) && document.activeElement.closest(".card[data-id]");
      const at = had ? [...list.querySelectorAll(".card[data-id]")].indexOf(had) : -1;
      list.replaceChildren(...els);
      if (had) {
        // the card that had the keyboard keeps it; if it left the list, the card now in its place takes it
        const cards = [...list.querySelectorAll(".card[data-id]")];
        const back = cards.find(c => c.dataset.id === had.dataset.id) || cards[Math.min(at, cards.length - 1)]
                     || list.querySelector(".empty button") || $("q");
        if (back) back.focus({preventScroll: true});
      }
      if (bubble) {
        const card = [...document.querySelectorAll(".card[data-id]")].find(c => c.dataset.id === bubble.dataset.for);
        if (card) { bubble.style.animation = "none"; if (!top) list.append(bubble); placeSay(bubble, card); } else sayGone();
      }
      if (revealing) els.forEach(e => { if (!before.has(e)) { e.classList.remove("enter"); void e.offsetWidth; e.classList.add("enter"); } });
      glide(els, was);
    }
    revealing = false;
    if (tip && !document.body.contains(tipTarget)) tipHide();
    fitPaths();
  }
  fit();
  if (scrollToAside && rest.length && !top) {
    scrollToAside = false;
    const r = $("sect").getBoundingClientRect(), l = list.getBoundingClientRect();
    if (!top && (r.top < l.top || r.bottom > l.bottom)) $("sect").scrollIntoView({block: "start"});
    // the control that revealed the section may be gone; the keyboard goes to the section
    if (!document.body.contains(document.activeElement) || document.activeElement === document.body) {
      $("sect").tabIndex = -1;
      $("sect").focus({preventScroll: true});
    }
  }
  const L = state.limits || {};
  const usage = [["5h", L.five_hour], ["Week", L.seven_day]].map(([n, v]) => {
    if (!state.ready) return `<div class="u"><span>${n}</span><span class="bar sk"></span><span></span></div>`;
    const val = v && v.pct != null ? pct(v.pct) + (v.note ? `<span class="rt">  ·  ${esc(v.note)}</span>` : "") : "no figure yet";
    const tipText = v && v.pct != null ? "" : ' data-tip data-full="Claude Code reports it with its next reply"';
    return `<div class="u"><span>${n}</span>${bar(v && v.pct)}<span data-k="u:${n}"${tipText}>${val}</span></div>`;
  }).join("");
  if ($("usage").dataset.html !== usage) { $("usage").innerHTML = usage; $("usage").dataset.html = usage; }
  if (state.error !== standing) { standing = state.error || null; showNote(); if (standing) announce(standing); }
  if (top && showHidden) {
    // the list opens under its link, inside the screen
    const f = $("footer").getBoundingClientRect();
    drop.style.left = Math.max(8, Math.min(f.right - drop.offsetWidth, innerWidth - drop.offsetWidth - 8)) + "px";
  }
  fadeChanged(q !== lastQ);
  lastQ = q;
}

// a figure whose text changed since it was last drawn fades in; one that did not stays still
// (the count does not fade while it follows the reader's typing: that is too frequent to animate)
const shown = new Map();
let lastQ = "";
function fadeChanged(typed) {
  const k = $("count");
  document.querySelectorAll("[data-k]").forEach(el => mark(el.dataset.k, el));
  mark("count", k, typed);
  function mark(key, el, still) {
    const t = el.textContent, was = shown.get(key);
    shown.set(key, t);
    if (!still && was !== undefined && was !== t) { el.classList.remove("chg"); void el.offsetWidth; el.classList.add("chg"); }
  }
}

// on top: a tab that wrapped past the strip's first row is not shown, and leaves the Tab order with it
function fit() {
  const cards = [...$("list").querySelectorAll(".card")], top = onTop();
  const row = cards.length ? cards[0].offsetTop : 0;
  cards.forEach(c => {
    const off = top && c.offsetTop > row;
    c.classList.toggle("off", off);
    if (off && c === document.activeElement) c.blur();
  });
}
function fitPaths() {
  // a title or flags that do not fit end in "…" and show in full in the tooltip
  const cut = [...document.querySelectorAll(".name, .flags")].map(el => [el, el.scrollWidth > el.clientWidth]);
  cut.forEach(([el, c]) => {
    el.classList.toggle("cut", c);
    if (el.dataset.path) el.dataset.full = c ? el.dataset.title + "\n" + el.dataset.path : el.dataset.path;
  });
}
addEventListener("resize", () => { fitPaths(); fit(); closeMenu(); sayGone(); });

// ----- messages: one about a card sits under that card; one about the whole panel floats above the link -----
// The bottom line shows a passing message when there is one, else the standing one (a failed
// read), so neither wipes the other.
let sayJob = null, passing = null, standing = null;
function showNote() {
  const n = $("note"), m = passing || (standing && {t: standing, cls: "warn"});
  n.textContent = m ? m.t : "";
  n.className = m ? m.cls : "";
}
function announce(text) { $("live").textContent = ""; requestAnimationFrame(() => { $("live").textContent = text; }); }
function sayGone() {
  clearTimeout(sayJob);
  document.querySelectorAll(".say").forEach(e => e.remove());
  if (passing) { passing = null; showNote(); }
}
// under the card, or above it when under would fall out of the visible list
function placeSay(b, card) {
  if (onTop()) {
    const r = card.getBoundingClientRect(), w = Math.max(r.width, 260);
    b.style.width = w + "px";
    b.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
    b.style.top = r.bottom + 6 + "px";
    return;
  }
  const list = $("list");
  b.style.left = card.offsetLeft + "px";
  b.style.width = card.offsetWidth + "px";
  const below = card.offsetTop + card.offsetHeight + 6;
  const fits = below + b.offsetHeight <= list.scrollTop + list.clientHeight;
  b.style.top = (fits ? below : card.offsetTop - b.offsetHeight - 6) + "px";
  b.classList.toggle("up", !fits);
}
// `wait` marks a message that stands until the answer replaces it ("Deleting…")
function say(card, text, err, wait) {
  if (!text) return;
  announce(text);
  sayGone();
  const list = $("list");
  if (card && document.body.contains(card) && (onTop() || list.contains(card))) {
    const b = document.createElement("div");
    b.className = "say" + (err ? " err" : "");
    b.textContent = text;
    b.dataset.for = card.dataset.id;
    (onTop() ? document.body : list).append(b);
    placeSay(b, card);
  } else {
    passing = {t: text, cls: err ? "err" : ""};
    showNote();
  }
  // a success leaves by itself; an error stays until the next click or Esc
  if (!err && !wait) sayJob = setTimeout(sayGone, 5000);
}
const reply = card => r => r && say(card, r.t, r.err);

// ----- tooltip (mindmap tooltip.md: opens on movement after ~400 ms, leaves by itself after ~3 s) -----
let tip = null, tipTarget = null, tipJob = null, tipEnd = null, tipDone = null, lx = -1, ly = -1;
function tipArm(el) {
  if (el === tipDone || tip || tipJob) return;
  tipTarget = el;
  tipJob = setTimeout(() => tipShow(el), 400);
}
function tipShow(el) {
  tipJob = null;
  if (!document.body.contains(el) || !el.dataset.full) return;
  const r = el.getBoundingClientRect();
  tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = el.dataset.full;
  document.body.append(tip);
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = (r.left + r.right) / 2 - w / 2, y = r.bottom + 6;
  const pop = el.closest(".pop");
  if (pop) {
    const p = pop.getBoundingClientRect();
    if (p.left - 6 - w >= 8) { x = p.left - 6 - w; y = r.top; }
    else if (p.right + 6 + w <= innerWidth - 8) { x = p.right + 6; y = r.top; }
    else { y = p.bottom + 6 + h <= innerHeight - 8 ? p.bottom + 6 : p.top - 6 - h; }
  } else if (y + h > innerHeight - 8) y = r.top - 6 - h;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  y = Math.max(8, Math.min(y, innerHeight - h - 8));
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  tipEnd = setTimeout(() => { tipDone = tipTarget; tipHide(); }, 3000);
}
function tipHide() {
  clearTimeout(tipJob); clearTimeout(tipEnd);
  tipJob = tipEnd = tipTarget = null;
  if (tip) { tip.remove(); tip = null; }
}
// only a real mouse that really moved opens a tooltip: not a touch, not a card sliding under a still pointer
addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || (e.clientX === lx && e.clientY === ly)) return;
  lx = e.clientX; ly = e.clientY;
  let p = e.target.closest(".cut, [data-tip]");
  if (menu && p && !menu.contains(p)) p = null;
  if (p !== tipDone) tipDone = null;
  if (p) { if (tipTarget && tipTarget !== p) tipHide(); tipArm(p); }
  else if (tipTarget) tipHide();
});
document.documentElement.addEventListener("mouseleave", tipHide);
// anything the reader does with the keyboard dismisses it
addEventListener("keydown", e => { if (e.key !== "Escape") tipHide(); }, true);
addEventListener("focusin", () => tipHide());

// ----- right-click menu, and the two-step confirm it turns into -----
let menu = null, menuFor = null, menuCard = null, swallow = false, quiet = false, byKey = false;
function setTarget(id) {
  menuFor = id;
  document.querySelectorAll(".card[data-id]").forEach(c => c.classList.toggle("target", c.dataset.id === id));
}
// focus that was in the menu goes back to its card, so the keyboard is never dropped onto the page
function closeMenu() {
  if (menu) {
    const back = menu.contains(document.activeElement) && menuCard && document.body.contains(menuCard);
    menu.remove(); menu = null;
    if (back) menuCard.focus({preventScroll: true});
  }
  menuCard = null;
  setTarget(null);
}
// opens below the pointer when it fits, above when it does not, and grows out of the pointer
function placePop(m, x, y) {
  const w = m.offsetWidth, h = m.offsetHeight;
  const up = y + h > innerHeight - 8 && y - h >= 8;
  m.classList.toggle("up", up);
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
  m.style.top = Math.max(8, Math.min(up ? y - h : y, innerHeight - h - 8)) + "px";
}
// the confirm sits under the card it asks about, or above it, never on it
function placeBy(m, card) {
  let r = card.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  if (r.bottom + 6 + h > innerHeight - 8 && r.top - 6 - h < 8) {
    // room on neither side: bring the card to the top of the list first
    const top = $("list").scrollTop;
    card.scrollIntoView({block: "start"});
    quiet = $("list").scrollTop !== top;  // only a scroll that happened sends an event to skip
    r = card.getBoundingClientRect();
  }
  const up = !(r.bottom + 6 + h <= innerHeight - 8) && r.top - 6 - h >= 8;
  m.classList.toggle("up", up);
  m.style.left = Math.max(8, Math.min(r.left + (r.width - w) / 2, innerWidth - w - 8)) + "px";
  m.style.top = (up ? r.top - 6 - h : Math.min(r.bottom + 6, innerHeight - h - 8)) + "px";
}
function openMenu(s, card, x, y) {
  tipHide(); closeMenu(); sayGone();
  setTarget(s.id);
  menuCard = card;
  const m = menu = document.createElement("div");
  m.className = "pop" + (byKey ? " now" : "");
  byKey = false;
  m.setAttribute("role", "menu");
  m.setAttribute("aria-label", `Actions for “${s.title}”`);
  const items = [];
  // a headless run is set aside already, so Hide would change nothing
  if (!(s.headless && !s.hidden)) items.push(s.hidden
    ? ["Unhide", "Moves it back to the main list", () => { closeMenu(); api().set_hidden(s.id, false); announce("Moved back to the main list."); }]
    : ["Hide", "Moves it to the hidden section; Unhide brings it back", () => { closeMenu(); api().set_hidden(s.id, true); announce("Hidden."); }]);
  if (s.status) items.push(["Close", "Closes its window; the conversation is kept", () => confirmIn(m, card,
    `Close “${s.title}”?`,
    "Its window closes and anything Claude is doing in it stops; the conversation is kept and can be resumed.",
    "Yes, Close", false, () => { say(card, "Closing…", false, true); api().close(s.id).then(reply(card)); })]);
  if (items.length) items.push(null);
  if (s.distro) items.push(["Delete", "", null, true, "Stored inside WSL, so it cannot go to the Recycle Bin."]);
  else if (s.status) items.push(["Delete", "Closes it, then moves its conversation to the Recycle Bin", () => confirmIn(m, card,
    `Delete “${s.title}”?`,
    "Its window closes first, then its conversation moves to the Recycle Bin; files in the project folder are not touched.",
    "Yes, Delete", true, () => { say(card, "Closing it, then deleting…", false, true); api().close_delete(s.id).then(reply(card)); }), true]);
  else items.push(["Delete", "Moves its conversation to the Recycle Bin", () => confirmIn(m, card,
    `Delete “${s.title}”?`,
    "Its conversation moves to the Recycle Bin; files in the project folder are not touched.",
    "Yes, Delete", true, () => { say(card, "Deleting…", false, true); api().delete(s.id).then(reply(card)); }), true]);
  for (const it of items) {
    if (!it) { m.insertAdjacentHTML("beforeend", '<div class="sep" role="separator"></div>'); continue; }
    const [label, outcome, act, danger, blocked] = it;
    const b = document.createElement("button");
    b.className = "item" + (danger && !blocked ? " danger" : "");
    b.setAttribute("role", "menuitem");
    b.textContent = label;
    // what the item does, for the keyboard and a screen reader as well as for the pointer's tooltip
    const o = document.createElement("span");
    o.className = "sr"; o.id = "o" + items.indexOf(it); o.textContent = blocked || outcome;
    m.append(o);
    b.setAttribute("aria-describedby", o.id);
    if (blocked) {
      // a blocked action stays in place and says why, right under itself
      b.setAttribute("aria-disabled", "true");
      b.dataset.tip = "";
      b.dataset.full = blocked;
      b.onclick = () => {
        if (m.querySelector(".why")) return;
        b.insertAdjacentHTML("afterend", `<div class="why" role="alert">${esc(blocked)}</div>`);
        placePop(m, x, y);  // the menu grew, so it is placed again
      };
    } else {
      b.dataset.tip = "";
      b.dataset.full = outcome;
      b.onclick = () => { m.dataset.outcome = outcome; act(); };
    }
    m.append(b);
  }
  document.body.append(m);
  placePop(m, x, y);
  m.querySelector(".item").focus({preventScroll: true});
}
function confirmIn(m, card, title, text, ok, danger, act) {
  m.setAttribute("role", "dialog");
  m.setAttribute("aria-labelledby", "cq");
  m.setAttribute("aria-describedby", "cd");
  m.removeAttribute("aria-label");
  m.innerHTML = `<div class="confirm"><h2 id="cq">${esc(title)}</h2><p id="cd">${esc(text)}</p><div class="actions">
    <button class="btn" data-a="no" data-tip data-full="Nothing changes">Cancel</button>
    <button class="btn ${danger ? "danger" : "go"}" data-a="yes" data-tip data-full="${esc(m.dataset.outcome || "")}">${esc(ok)}</button></div></div>`;
  m.querySelector('[data-a="no"]').onclick = closeMenu;
  m.querySelector('[data-a="yes"]').onclick = () => { closeMenu(); act(); };
  m.style.animation = "none"; void m.offsetWidth; m.style.animation = "";
  placeBy(m, card);
  m.querySelector('[data-a="no"]').focus({preventScroll: true});  // Cancel is the default
}

// ----- input -----
const list = $("list");
const cardOf = e => e.target.closest(".card[data-id]");
const find = id => state.sessions.find(s => s.id === id);
// a click outside an open menu only closes it, as a menu does
addEventListener("mousedown", e => {
  swallow = false;
  if (menu && !menu.contains(e.target)) { closeMenu(); swallow = e.button === 0; e.stopPropagation(); }
  // the list under the strip closes on a click anywhere but in it or on its link, as a dropdown does
  else if (onTop() && showHidden && !e.target.closest("#drop, #footer, .pop")) { showHidden = false; render(); }
  const onBar = e.target === list && (onTop() ? e.offsetY >= list.clientHeight : e.offsetX >= list.clientWidth);
  if (!e.target.closest(".say") && !onBar) sayGone();
  tipHide();
}, true);
addEventListener("click", e => { if (swallow) { swallow = false; e.stopPropagation(); } }, true);
// An open session comes forward on a single click; a closed one opens only on a double click,
// so a stray click never starts a session.
// the answer to a single click waits a moment, so a double click never flashes "Double-click to open it." first
// A click on an open session whose window is already in front minimises it, so the second click of a double
// click is ignored: a double click counts as one click there, not as raise and minimise.
let dblAt = 0, firstClick = null;
for (const box of [list, $("drop")]) {
box.addEventListener("click", e => {
  const c = cardOf(e);
  if (!c || e.detail > 1) return;
  const p = api().click(c.dataset.id);
  firstClick = {id: c.dataset.id, p};
  p.then(r => setTimeout(() => { if (Date.now() - dblAt > (state.dbl || 500) + 100) reply(c)(r); }, (state.dbl || 500) + 50));
});
box.addEventListener("dblclick", e => {
  const c = cardOf(e);
  if (!c) return;
  dblAt = Date.now();
  // nothing to open (its folder is gone, or it is open already): the single click's answer stands
  const first = firstClick && firstClick.id === c.dataset.id ? firstClick.p : Promise.resolve(null);
  api().open(c.dataset.id).then(r => r ? reply(c)(r) : first.then(reply(c)));
});
addEventListener("contextmenu", e => {
  if (e.target.closest && e.target.closest("input")) return;  // the search box keeps its own Cut/Copy/Paste
  e.preventDefault();
  // the menu key fires this on key-up, after its menu is already open
  if (menu && menu.contains(e.target)) return;
  const c = cardOf(e), s = c && find(c.dataset.id);
  // a tab in the strip is too low to hold a menu: it opens at the strip's bottom edge, covering none of it
  const y = s && onTop() && list.contains(c) ? document.body.getBoundingClientRect().bottom : e.clientY;
  if (s) openMenu(s, c, e.clientX, y); else closeMenu();
});
box.addEventListener("keydown", e => {
  const c = e.target.closest && e.target.closest(".card[data-id]"), s = c && find(c.dataset.id);
  if (!s) return;
  // a held key repeats about 30 times a second: only its first press counts, or a closed card opened once per repeat
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (e.repeat) return; (s.status || !s.here ? api().click(s.id) : api().open(s.id)).then(reply(c)); }
  else if (e.key === "ContextMenu" || (e.key === "F10" && e.shiftKey)) {
    e.preventDefault();
    const r = c.getBoundingClientRect();
    byKey = true;
    openMenu(s, c, r.left + 16, r.bottom);
  }
});
}
list.addEventListener("pointerenter", () => { hovering = true; });
// a pointer still over the list after the window lost focus holds the order again once it moves
list.addEventListener("pointermove", () => { hovering = true; });
list.addEventListener("pointerleave", () => { hovering = false; lastKey = null; render(); });
list.addEventListener("scroll", () => { tipHide(); if (quiet) quiet = false; else closeMenu(); });
$("drop").addEventListener("scroll", () => { tipHide(); sayGone(); closeMenu(); });
// a window raised over the panel sends no pointerleave, so losing focus ends the hold as well;
// on top it also closes the list under the strip, as a dropdown does
addEventListener("blur", () => { tipHide(); closeMenu(); hovering = false; if (onTop()) showHidden = false; lastKey = null; render(); });
// Tab closes the menu and gives the keyboard back to its card; inside the confirm it stays on the two buttons
addEventListener("keydown", e => {
  if (!menu || e.key !== "Tab") return;
  if (menu.getAttribute("role") === "menu") { e.preventDefault(); closeMenu(); return; }
  const bs = [...menu.querySelectorAll(".btn")], i = bs.indexOf(document.activeElement);
  e.preventDefault();
  bs[(i + (e.shiftKey ? -1 : 1) + bs.length) % bs.length].focus({preventScroll: true});
});
// the menu is walked with the arrow keys, Home and End
addEventListener("keydown", e => {
  if (!menu || !["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const its = [...menu.querySelectorAll(".item, .btn")];
  if (!its.length) return;
  e.preventDefault();
  const i = its.indexOf(document.activeElement);
  const j = e.key === "Home" ? 0 : e.key === "End" ? its.length - 1
          : (i + (e.key === "ArrowDown" ? 1 : -1) + its.length) % its.length;
  its[j].focus({preventScroll: true});
});
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (menu || tip || document.querySelector(".say")) { e.preventDefault(); tipHide(); closeMenu(); sayGone(); return; }
  if (passing) { e.preventDefault(); sayGone(); return; }
  if (onTop() && showHidden) { e.preventDefault(); showHidden = false; render(); $("footer").focus(); return; }
  if (document.activeElement === $("q") && $("q").value) { e.preventDefault(); setQ(""); }
});
// the search clears in one step: its × or Escape
function setQ(v) { $("q").value = v; $("qx").hidden = !v; $("q").focus(); render(); }
$("q").addEventListener("input", () => { $("qx").hidden = !$("q").value; render(); });
$("qx").addEventListener("mousedown", e => e.preventDefault());
$("qx").onclick = () => setQ("");
// a click with the mouse lets the section fade in; Enter or Space shows it at once
function toggleAside(e) { showHidden = !showHidden; scrollToAside = showHidden; revealing = showHidden && e.detail > 0; render(); }
$("footer").onclick = toggleAside;
list.addEventListener("click", e => { if (e.target.closest('[data-a="aside"]')) toggleAside(e); });
$("hide").onclick = () => window.pywebview && api().hide();

// ----- docking: the header (the grip on top) drags the panel between the right edge and the top edge -----
// agent-panel.pyw moves the window while the button is held and changes its shape on the way
let grab = null;
document.querySelector("header").addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest("button, input")) return;
  grab = {x: e.clientX, y: e.clientY};
});
addEventListener("pointermove", e => {
  if (!grab) return;
  if (!(e.buttons & 1)) { grab = null; return; }
  if (Math.hypot(e.clientX - grab.x, e.clientY - grab.y) < 4) return;
  const g = grab;
  grab = null;
  tipHide(); closeMenu(); sayGone();
  document.body.classList.add("dragging");
  api().drag(g.x, g.y).then(() => document.body.classList.remove("dragging"));
});
addEventListener("pointerup", () => { grab = null; });
function setDock(d) {
  const top = d === "top";
  if (top === onTop()) return;
  tipHide(); closeMenu(); sayGone();
  document.body.classList.toggle("top", top);
  placeHide();
  showHidden = false;
  regionKey = "";
  lastKey = null;
  render();
}

// the hide button ends the strip on top, in the reading order as well as on screen; on the right it is in the header
function placeHide() {
  if (onTop()) document.body.insertBefore($("hide"), $("drop"));
  else document.querySelector("header").append($("hide"));
}

window.app = { update(st) { state = Object.assign(st, {ready: !!st.scanned}); render(); }, dock: setDock };
document.body.classList.toggle("top", window.DOCK === "top");
placeHide();
render();
addEventListener("pywebviewready", () => { bridged = true; api().ready(); });
</script>
</body>
</html>
