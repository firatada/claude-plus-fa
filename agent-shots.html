<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Agents Screenshots</title>
<!-- The Agent Panel's strip of the last three screenshots and the pinned ones (the maintainer, 2026-11-15 and 16), and the large preview
     a click on one opens. agent-panel.pyw loads this page twice: as the strip, and with window.MODE = "view" as the
     preview. Both float over every window without ever taking the keyboard.
     Strip: the pinned ones in the order they were pinned, then the last three others, newest first, wrapping into further rows when
     agent-panel.pyw makes the window narrower than one row (it would leave the screen). Pin keeps a screenshot in the
     strip however many newer ones come (agent-panel.pyw stores it); a click on its blue Pin unpins it. Pressing anywhere and moving drags the whole strip (agent-panel.pyw moves the window while
     the button is held and tells, on release, whether it was a drag); a press released in place is a click. A click
     on a picture shows it large at once (the preview holds all three pictures at full size already); a click on the
     same picture closes it. Copy puts the file's current path and its OCR text on the clipboard as text, so a prompt
     gets a few tokens instead of a picture. The window is exactly the strip (rounded by a window region).
     Numbers (2026-11-17): every card carries a badge at the left of its top row, before Pin (Copy at the right). The
     two groups count apart: the recent ones 1, 2, 3 from the newest back (a new screenshot becomes 1), the pinned ones
     1, 2, ... in the order they were pinned (an unpin closes the gap), their badge led by a pin glyph so a pinned 1
     never reads as the recent 1. agent-panel.pyw sends the numbers; the preview's head shows the same badge.
     Preview: the picture at up to its own size, its name, a Copy as Text button (2026-11-20: the strip's Copy, the
     same call and feedback; the preview stays open), a Copy as Image button (2026-11-22: the picture itself on the
     clipboard, for Paint, Word, a browser or a chat app; the strip's cards keep their one Copy, as text), a Delete button (the file to the Recycle Bin, wherever it
     is now, no question asked: the Recycle Bin is the undo; the strip then fills up with the next older one) and an
     Open button (the default viewer). A click on it, a click outside it, or Esc closes it. Spark tokens as in agent-panel.html. Sizes: agent-panel.pyw SHOT_W, SHOT_H,
     SHOT_PAD, VIEW_HEAD, VIEW_PAD.
     Text cards (2026-11-17, the maintainer: "write it inside, no thumbnail, the thumbnail is useless"): a card shows
     no picture, only the window or session title (up to 3 lines, then an ellipsis) and, on its own last line, the
     time (agent-panel.pyw shot_label() reads both from the file name). The badge, Pin and Copy sit in a row across
     the card's top, above the text, so none of them covers it. The preview is the only place the picture appears.
     Pointing at a card shows the full file name in the panel's tooltip (agent-panel.html .tip: 400 ms, gone after
     3 s or on a press); the strip window is exactly the strip, so it sits inside it, over the card's title, its
     foot just above the time.
     The strip holds the screenshots alone (2026-11-23): the session tabs and the line naming the session sit at
     the top of the reply window (agent-reply.html), a window of its own left of the strip, so the two read as two
     edged surfaces. While a session is open the strip's columns leave the reply window its width and the
     screenshots wrap into rows (agent-panel.pyw sends the columns with shotStrip.update(items, cols, h)); a full row
     is as wide as the reply window, its cards spread over it. A row is as tall as the reply window's head (the
     maintainer, 2026-11-25: the tabs and the line under them), so the two windows' edges line up top and bottom:
     agent-panel.pyw sends the card's height h, and every row, wrapped or not, takes it. The card is compact: its
     top row, the name under it, the time small right under the name. The
     selections for the ":" reply are marked inside the reply window, not listed here.
-->
<style>
:root {
  --panel: #ffffff; --line: #e2e8f5; --text: #0a1a40; --muted: #4b5672; --blue: #1b4df5; --green: #16a34a;
  --red-deep: #be123c; --red: #e11d48; --violet: #5c3bcd; --r-small: 6px; --tip-bg: rgba(10, 26, 64, .88); --shadow-tip: 0 6px 16px rgba(10, 26, 64, .2);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--panel); color: var(--text); font: 600 11px/1 "Segoe UI", system-ui, sans-serif;
  overflow: hidden; user-select: none; cursor: default;
}
button { font: inherit; cursor: pointer; }
#strip {
  height: 100%; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 6px;
}  /* no edge of its own: the window's DWM frame draws it, square with its shadow, as the panel's */
body.moving, body.moving * { cursor: grabbing !important; }
/* a card: SHOT_W x --h (150 wide so the top row holds a pinned 2-digit badge, Pin and "Reading…"; --h from
   agent-panel.pyw, 73 for a reply window head of 85). The whole card is the button that opens the preview; its text
   starts under the top row (6 + 20 + 3): the title on as many 13 px lines as the height leaves (--lines, 2 at 73),
   then the time small right under it, never cut */
/* the screenshots: as many columns as agent-panel.pyw allows, wrapping into rows; a window wider than the columns
   (a full row matched to the reply window's width) spreads them over it, every row on the same columns */
#shots { flex: 1 1 100%; display: grid; grid-template-columns: repeat(var(--cols, 1), 150px); justify-content: space-between; align-content: start; gap: 6px; }
.shot { position: relative; flex: none; width: 150px; height: var(--h, 73px); }
.pic {
  width: 100%; height: 100%; padding: 29px 8px 5px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text); text-align: left; display: flex; flex-direction: column;
  transition: transform .16s ease-out;
}
.pic:hover, .pic.open { border-color: var(--blue); box-shadow: 0 0 0 .5px var(--blue); }
.pic:active { transform: scale(.97); }
.pic .t {
  flex: none; font: 600 11px/13px "Segoe UI", system-ui, sans-serif; overflow-wrap: anywhere; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 2);
  max-height: calc(var(--lines, 2) * 13px);
}
.pic .w { flex: none; color: var(--muted); font: 400 10px/12px "Segoe UI", system-ui, sans-serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the top row: badge, Pin, then Copy at the right; a press between them is a press on the card */
.bar { position: absolute; top: 6px; left: 6px; right: 6px; height: 20px; display: flex; align-items: center;
  gap: 4px; pointer-events: none; }
.bar > * { flex: none; }
.copy, .pin {
  height: 20px; padding: 0 7px; border: 1px solid var(--line); border-radius: var(--r-small);
  background: var(--panel); color: var(--muted); pointer-events: auto;
}
.copy { margin-left: auto; }
.copy:hover, .pin:hover { color: var(--blue); border-color: var(--blue); }
.pin.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.copy.done { color: var(--green); border-color: var(--green); }
/* the number badge: dark with a white edge, readable on a light or a dark screenshot; the pinned one adds a pin */
.num {
  flex: none; height: 16px; min-width: 16px; padding: 0 4px; display: inline-flex; align-items: center;
  justify-content: center; gap: 2px; border-radius: 4px; background: rgba(10, 26, 64, .86); color: #fff;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .8); font: 700 10px/1 "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.num svg { width: 9px; height: 9px; fill: currentColor; }
#badge:empty { display: none; }
.copy.fail { color: var(--red-deep); }
.tip {
  position: fixed; z-index: 20; max-width: calc(100vw - 8px); padding: 5px 8px; border-radius: var(--r-small);
  background: var(--tip-bg); color: #fff; font: 400 11px/1.35 "Segoe UI", system-ui, sans-serif;
  white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; box-shadow: var(--shadow-tip);
  animation: fade .12s ease-out;
}
@keyframes fade { from { opacity: 0; } }
/* the preview: a 36 px head (name, Delete, Copy as Text, Copy as Image, Open) over the picture, 8 px round it */
#view { display: none; height: 100%; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; }
body.view #strip { display: none; }
body.view #view { display: flex; }
#head { flex: none; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; }
#name { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
#open, #del, #copy, #copyimg {
  flex: none; height: 24px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-small);
  background: var(--panel); color: var(--muted);
}
/* the two copies sit between Delete and Open, each as wide as its own label, so "Reading…", "Copied" or "Failed"
   never move a button; Delete keeps 16 px from them, away from the corner where a hurried press lands */
#copy { min-width: 86px; }
#copyimg { min-width: 96px; }
#del { margin-right: 8px; }
#open:hover, #copy:hover, #copyimg:hover { color: var(--blue); border-color: var(--blue); }
#copy.done, #copyimg.done { color: var(--green); border-color: var(--green); }
#copy.fail, #copyimg.fail { color: var(--red-deep); }
#del:hover, #del.fail { color: var(--red-deep); border-color: var(--red-deep); }
#big { flex: 1; min-height: 0; padding: 0 8px 8px; }
#big img { display: none; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; }
#big img.on { display: block; }
@media (prefers-reduced-motion: reduce) {
  .pic, .tip { transition: none; animation: none; } .pic:active { transform: none; }
}
</style>
</head>
<body>
<div id="strip"><div id="shots"></div></div>
<div id="view"><div id="head"><span id="badge" class="num" aria-hidden="true"></span><span id="name"></span><button type="button" id="del" aria-label="Delete: move it to the Recycle Bin">Delete</button><button type="button" id="copy">Copy as Text</button><button type="button" id="copyimg">Copy as Image</button><button type="button" id="open">Open</button></div><div id="big"></div></div>
<script>
/*MODE*/
const api = () => window.pywebview.api;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const strip = document.getElementById("strip");
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3H8v2h1v6l-3 3v2h5v6l1 1 1-1v-6h5v-2l-3-3V5h1z"/></svg>';
const badge = s => (s.pin ? PIN : "") + s.num;  // the badge's inside: a pin glyph for the pinned sequence
const label = s => (s.pin ? "pinned " : "") + s.num + ", " + s.name;
const shots = document.getElementById("shots");

// the strip's Copy and the preview's Copy as Text (how "copy": path and OCR text), the preview's Copy as Image
// (how "copy_image": the picture itself): one feedback, then the button's own label back
function copy(btn, at, how = "copy") {
  const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
  btn.textContent = how === "copy" ? "Reading…" : "Copying…";
  btn.classList.remove("done", "fail");
  api()[how](at).then(ok => {
    btn.textContent = ok ? "Copied" : "Failed";
    btn.classList.add(ok ? "done" : "fail");
    setTimeout(() => { btn.textContent = label; btn.classList.remove("done", "fail"); }, 1600);
  });
}

function pin(btn, at) {  // shown at once; agent-panel.pyw stores it and redraws the strip in its new place
  const on = !btn.classList.contains("on");
  btn.classList.toggle("on", on);
  btn.setAttribute("aria-pressed", on);
  api().pin(at);
}

// items: [{at, name, pin, num, title, when}] (no picture: the preview alone shows one), the pinned ones first by pin order, then the recent ones newest first; num
// counts within each group from 1; agent-panel.pyw sizes the window; h: a card's height (the reply window's head less
// the strip's padding), the title taking the lines left under the top row (29) above the time (12) and the foot (5)
window.shotStrip = {
  update(items, cols, h) {
    shots.style.setProperty("--cols", Math.max(1, cols || 0));
    h = h || 73;
    shots.style.setProperty("--h", h + "px");
    shots.style.setProperty("--lines", Math.max(1, Math.floor((h - 29 - 12 - 5) / 13)));
    shots.innerHTML = items.map(s => `<div class="shot" data-full="${esc(s.name)}">
      <button type="button" class="pic" data-at="${s.at}" aria-label="Enlarge ${esc(label(s))}"><span class="t">${esc(s.title)}</span><span class="w">${esc(s.when)}</span></button>
      <div class="bar"><span class="num" aria-hidden="true">${badge(s)}</span>
      <button type="button" class="pin${s.pin ? " on" : ""}" data-at="${s.at}" aria-pressed="${s.pin}" aria-label="Pin ${esc(s.name)}: keep it in the strip">Pin</button>
      <button type="button" class="copy" data-at="${s.at}" aria-label="Copy the path and text of ${esc(s.name)}">Copy</button></div>
    </div>`).join("");
    tipHide();
  },
  open(at) {  // the picture the preview shows is outlined; null: none
    strip.querySelectorAll(".pic").forEach(b => b.classList.toggle("open", Number(b.dataset.at) === at));
  },
};

// ----- tooltip: the full file name, as the panel's (mindmap tooltip.md: opens on movement after ~400 ms, leaves by
// itself after ~3 s or on any press); Pin and Copy name themselves, so pointing at them opens none -----
let tip = null, tipTarget = null, tipJob = null, tipEnd = null, tipDone = null, lx = -1, ly = -1;
function tipShow(el) {
  tipJob = null;
  if (!document.body.contains(el)) return;
  tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = el.dataset.full;
  document.body.append(tip);
  // the window ends at the strip's edge: centred on the card, over the title it spells out in full, its foot just
  // above the time so that stays readable, kept inside
  const r = el.getBoundingClientRect(), t = el.querySelector(".w");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.max(4, Math.min((r.left + r.right) / 2 - w / 2, innerWidth - w - 4));
  const y = t ? Math.max(4, Math.min(t.getBoundingClientRect().top - 2 - h, innerHeight - h - 4))
    : Math.max(4, Math.min(r.bottom + 4, innerHeight - h - 4));
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  tipEnd = setTimeout(() => { tipDone = tipTarget; tipHide(); }, 3000);
}
function tipHide() {
  clearTimeout(tipJob); clearTimeout(tipEnd);
  tipJob = tipEnd = tipTarget = null;
  if (tip) { tip.remove(); tip = null; }
}
addEventListener("pointermove", e => {  // only a real mouse that really moved: not a card redrawn under a still pointer
  if (e.pointerType !== "mouse" || (e.clientX === lx && e.clientY === ly) || pressed) return;
  lx = e.clientX; ly = e.clientY;
  const p = e.target.closest(".pin, .copy") ? null : e.target.closest(".shot");
  if (p !== tipDone) tipDone = null;
  if (p && p === tipTarget) return;
  tipHide();
  if (p && p !== tipDone) { tipTarget = p; tipJob = setTimeout(() => tipShow(p), 400); }
});
document.documentElement.addEventListener("mouseleave", tipHide);
addEventListener("blur", tipHide);

// A press anywhere on the strip: agent-panel.pyw follows the pointer and moves the window once it has gone a few
// pixels. On release it says whether that happened; only a press released in place counts as a click.
let pressed = null;
strip.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  e.preventDefault();
  tipDone = tipTarget || e.target.closest(".shot");  // a press dismisses it, and it does not come back on that card
  tipHide();
  try { strip.setPointerCapture(e.pointerId); } catch (_) {}  // the release still arrives if the pointer leaves
  // release() waits for press()'s answer, so the two never cross on their way to agent-panel.pyw
  pressed = {b: e.target.closest("button"), x: e.screenX, y: e.screenY, n: api().press()};
});
strip.addEventListener("pointermove", e => {
  if (pressed && Math.hypot(e.screenX - pressed.x, e.screenY - pressed.y) >= 4) document.body.classList.add("moving");
});
strip.addEventListener("pointerup", e => {
  if (!pressed || e.button !== 0) return;
  const {b, n} = pressed;
  pressed = null;
  n.then(id => api().release(id)).then(moved => {
    document.body.classList.remove("moving");
    if (moved || !b) return;
    const at = Number(b.dataset.at);
    if (b.classList.contains("copy")) copy(b, at);
    else if (b.classList.contains("pin")) pin(b, at);
    else api().enlarge(at);
  });
});
strip.addEventListener("lostpointercapture", () => { pressed = null; document.body.classList.remove("moving"); });

// ----- the preview -----
// every picture of the strip is kept here at full size, decoded, so showing one is instant; items:
// [{at, name, pin, num, src?}], src only when the picture is new or changed
const big = document.getElementById("big");
const shown = {};  // at -> {img, name}
let current = null;
window.shotView = {
  update(items) {
    const keep = new Set(items.map(i => String(i.at)));
    for (const at of Object.keys(shown)) if (!keep.has(at)) { shown[at].img.remove(); delete shown[at]; }
    for (const i of items) {
      if (i.src) {
        if (shown[i.at]) shown[i.at].img.remove();
        const img = new Image();
        img.alt = "";
        img.src = i.src;
        img.decode().catch(() => {});
        big.appendChild(img);
        shown[i.at] = {img};
      }
      if (shown[i.at]) Object.assign(shown[i.at], {name: i.name, pin: i.pin, num: i.num});
    }
    if (current !== null && shown[current]) head(shown[current]);  // a new screenshot or an unpin renumbers it
  },
  show(at) {
    current = at;
    for (const [k, v] of Object.entries(shown)) v.img.classList.toggle("on", Number(k) === at);
    head(shown[at]);
  },
  hide() {
    current = null;
    for (const v of Object.values(shown)) v.img.classList.remove("on");
  },
};
function head(v) {
  document.getElementById("name").textContent = v ? v.name : "";
  vcopy.setAttribute("aria-label", v ? "Copy the path and text of " + v.name : "Copy as Text");
  vimg.setAttribute("aria-label", v ? "Copy the picture of " + v.name : "Copy as Image");
  document.getElementById("badge").innerHTML = v ? badge(v) : "";
}
const del = document.getElementById("del"), vcopy = document.getElementById("copy"), vimg = document.getElementById("copyimg");
document.getElementById("view").addEventListener("click", e => {
  if (e.target.closest("#open")) api().open(current);
  else if (e.target.closest("#copy")) copy(vcopy, current);  // as the strip's Copy; the preview stays
  else if (e.target.closest("#copyimg")) copy(vimg, current, "copy_image");
  else if (e.target.closest("#del")) {
    // agent-panel.pyw closes the preview once the file is in the Recycle Bin; a refusal shows here for a moment
    api().delete(current).then(ok => {
      if (ok) return;
      del.textContent = "Failed";
      del.classList.add("fail");
      setTimeout(() => { del.textContent = "Delete"; del.classList.remove("fail"); }, 1600);
    });
  }
  else api().close();
});

if (window.MODE === "view") document.body.classList.add("view");
addEventListener("pywebviewready", () => api().ready());
</script>
</body>
</html>
