<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Agents Reply</title>
<!-- The reply window (the maintainer, 2026-11-23): a window of its own at the screen's left edge, its top on the
     screenshot strip's, edged by DWM as the strip and the panel are, so it reads as its own surface. Its head holds a
     tab per open session (the panel's state dot, its name, the time of its last reply; the one shown outlined), a
     button that folds the window to its head or opens it again, and right under the tabs a line naming the session
     shown, its folder and the times of its last reply and of the prompt it answers (agent-panel.pyw sends it with
     reply.head()). A tab press released in place shows that session; a press on the head may drag the window and
     the strip together. Under the head it shows every reply Claude gave in that session since the prompt the user
     last typed there, one under the other (agent-reply.py reads them from the transcript; agent-panel.pyw sends them with
     reply.show()), its markdown drawn as Claude Code draws it: headings, bold, italics, strikethrough, inline code,
     links (opened in the browser), lists, quotes, tables (a table is one paragraph) and rules. Claude's text is
     never changed. A click on a paragraph (a list item and a table count as one) opens a box under it,
     "Type your answer…", with the caret in it; another click on that paragraph closes it while it is empty, and a
     box holding text stays open (2026-11-23: resting the pointer only tints the paragraph and, after a moment, says
     it can be answered). A drag that selects text, a double click, and clicks on a link, a code block, Pin or a
     ":N" badge never open or close a box. Several boxes can be open. What the user types there is theirs, in blue on
     a light blue ground with a blue rule on the left, kept per session (agent-panel.pyw stores it through api.draft)
     until it is sent; a box with a kept answer is open when the reply is shown.
     Code blocks show shut, as one line (language, lines, first line), and open on a click. The passages selected
     in the terminal for the ":N" reply show marked where they stand, led by their ":N"; one that is not in the
     reply text is listed at the bottom. The bar at the bottom counts the answers and selections; Send to Session pastes
     into the session's prompt, without Enter, each reply answered, whole, with the answers inside it (agent-reply.py
     answer_text(): the reply quoted with "> ", each answer unquoted after the block it answers, led by "My answer:");
     Copy puts the same text on the clipboard.
     The window grows with its content; taller than the screen allows, the replies scroll inside. agent-panel.pyw
     sizes it from what api.size() reports. Spark tokens as in agent-panel.html.
     Pins (2026-11-23): every reply carries Pin at the right of its top line (the strip's Pin: blue when on).
     A session with pinned replies shows a row of chips under its tabs: Latest first (the replies since the last
     prompt), then one chip per pin in the order pinned (its first words, its time, an x that unpins it). A chip
     shows its reply in place of the latest ones, answer boxes and Send to Session as on them; Latest, a tab press or
     another session coming up shows the latest replies again. agent-panel.pyw keeps the pins with their text, 8 per
     session at most: a 9th asks, in a line under the head, to unpin the oldest first. -->
<style>
:root {
  --bg: #f4f6fb; --panel: #ffffff; --surface2: #eef2fb; --line: #e2e8f5; --text: #0a1a40; --muted: #4b5672;
  --faint: #687189; --violet: #5c3bcd; --blue: #1b4df5; --green: #16a34a; --red: #e11d48; --red-deep: #be123c;
  --hit: #dbe4ff; --ans-bg: #f5f8ff; --r-ctl: 10px; --r-small: 6px; --tip-bg: rgba(10, 26, 64, .88);
  --shadow-tip: 0 6px 16px rgba(10, 26, 64, .2); --snap: cubic-bezier(0.23, 1, 0.32, 1); --edge: 20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--panel); color: var(--text); font: 400 14px/22px "Segoe UI", system-ui, sans-serif;
  overflow: hidden; display: flex; flex-direction: column; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
/* the head: the tabs, the fold button at their right, and right under them the line naming the session shown; the
   head, the replies, the bottom bar and its text share one left edge (--edge) */
#head { flex: none; padding: 8px 8px 8px var(--edge); border-bottom: 1px solid var(--line); user-select: none; cursor: default; }
body.folded #head { border-bottom: 0; }
body.folded #body, body.folded #miss, body.folded #foot, body.folded #ask { display: none; }
body.moving, body.moving * { cursor: grabbing !important; }
.tabrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.tabs { flex: 1 1 auto; display: flex; gap: 6px; align-items: center; min-width: 0; overflow: hidden; }
.tab {
  flex: 0 1 auto; min-width: 0; max-width: 220px; height: 34px; padding: 0 12px; display: flex; align-items: center;
  gap: 8px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--panel); color: var(--text);
  font: 600 12px "Segoe UI", system-ui, sans-serif; transition: transform .16s ease-out;
}
.tab:hover { border-color: var(--blue); }
.tab:active, #fold:active { transform: scale(.97); }
.tab.on { border-color: var(--blue); box-shadow: 0 0 0 .5px var(--blue), 0 0 0 3px rgba(27, 77, 245, .12); }
.tab .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .at { flex: none; font-weight: 400; color: var(--muted); font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px var(--violet); }
.dot.ask { background: var(--red); box-shadow: none; }
.dot.work { width: 10px; height: 10px; box-shadow: none; border: 1.5px solid var(--green); border-right-color: transparent;
  animation: turn 1s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
#fold { flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--r-ctl); background: none;
  color: var(--muted); display: grid; place-items: center; transition: transform .16s ease-out; }
#fold:hover { color: var(--blue); background: var(--surface2); }
#fold svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
  stroke-linejoin: round; transition: transform .16s ease-out; }
#fold.shut svg { transform: rotate(180deg); }
/* the pinned replies: Latest, then a chip per pin (its words, its time, an x); shown while the session has pins */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; animation: drop .16s var(--snap); }
.chips:empty { display: none; }
.chip { flex: 0 1 auto; min-width: 0; max-width: 250px; height: 28px; display: flex; align-items: center;
  border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--panel); color: var(--muted);
  font: 400 12px "Segoe UI", system-ui, sans-serif; transition: transform .16s ease-out; }
.chip:hover { border-color: var(--blue); }
.chip:active { transform: scale(.97); }
.chip.on { border-color: var(--blue); color: var(--text); box-shadow: 0 0 0 .5px var(--blue), 0 0 0 3px rgba(27, 77, 245, .12); }
.chip button { height: 100%; border: 0; background: none; display: flex; align-items: center; gap: 6px; min-width: 0; }
.chip .go { padding: 0 10px; min-width: 0; color: inherit; }
.chip .go svg { width: 11px; height: 11px; fill: var(--blue); flex: none; }
.chip .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on .w { font-weight: 600; }
.chip .at { flex: none; color: var(--faint); font-size: 11px; }
.chip .x { flex: none; width: 24px; margin-left: -6px; justify-content: center; color: var(--faint); border-radius: 0 var(--r-ctl) var(--r-ctl) 0; }
.chip .x:hover { color: var(--red-deep); }
.chip .x svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
/* "8 pins is the most": asked in place, under the head */
#ask { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px var(--edge); background: #fffbeb;
  border-bottom: 1px solid #fde68a; font: 400 12px/16px "Segoe UI", system-ui, sans-serif; color: var(--text);
  animation: drop .16s var(--snap); }
#ask[hidden] { display: none; }
#ask .q { flex: 1; min-width: 0; }
#ask .b { min-height: 28px; }
.meta { margin-top: 6px; color: var(--muted); font: 400 12px/16px "Segoe UI", system-ui, sans-serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta b { font-weight: 600; color: var(--text); }
.meta:empty { display: none; }
#body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 28px 10px var(--edge);
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
#replies { display: flow-root; }  /* holds its children's margins, so its height is the content's (natural()) */
/* one reply; several are parted by a hairline and the time each came */
.reply + .reply { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
/* a reply's top line: its time, and Pin at the right (the strip's Pin: blue when on) */
.rtop { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 2px; }
.when { color: var(--faint); font: 400 11px/16px "Segoe UI", system-ui, sans-serif; }
.rpin { margin-left: auto; height: 20px; padding: 0 7px; border: 1px solid var(--line); border-radius: var(--r-small);
  background: var(--panel); color: var(--muted); font: 600 11px/1 "Segoe UI", system-ui, sans-serif;
  transition: transform .16s ease-out; }
.rpin:hover { color: var(--blue); border-color: var(--blue); }
.rpin:active { transform: scale(.97); }
.rpin.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.para { position: relative; padding: 4px 0; border-radius: 6px; overflow-wrap: anywhere; }
.para.h { font-weight: 600; padding-top: 8px; }
.para.h1 { font-size: 17px; line-height: 24px; }
.para.h2 { font-size: 15px; }
.para.quote { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); }
/* a table: one paragraph (one answer box); wider than the window, it scrolls sideways on its own */
.para.table { overflow-x: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.para.table table { border-collapse: collapse; font: 400 13px/20px "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.para.table th, .para.table td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; vertical-align: top; }
.para.table th { background: var(--surface2); font-weight: 600; }
.para.pre { font: 400 12px/18px "Cascadia Mono", Consolas, monospace; white-space: pre; overflow-x: auto; }
a.lnk { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(27, 77, 245, .4); cursor: pointer; }
a.lnk:hover { text-decoration-color: var(--blue); }
.para.li { display: grid; grid-template-columns: 22px minmax(0, 1fr); }
.para.li > .n { color: var(--muted); font-variant-numeric: tabular-nums; }
#replies .para:hover { background: rgba(27, 77, 245, .04); }  /* with its tooltip, the hint that a click answers it */
.hr { height: 1px; background: var(--line); margin: 10px 0; }
code { font: 400 12.5px "Cascadia Mono", Consolas, monospace; background: var(--surface2); border-radius: 4px; padding: 1px 4px; }
/* a code block: shut, one line, opens on a click */
.code { margin: 6px 0; border: 1px solid var(--line); border-radius: var(--r-small); background: var(--surface2); }
.code > button { width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 0;
  background: none; color: var(--muted); font: 400 12px "Segoe UI", system-ui, sans-serif; text-align: left; }
.code > button:hover { color: var(--blue); }
.code svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
  stroke-linejoin: round; flex: none; transition: transform .16s var(--snap); }
.code.open svg { transform: rotate(90deg); }
.code .k { font-weight: 600; color: var(--text); }
.code .first { font: 400 12px "Cascadia Mono", Consolas, monospace; color: var(--faint); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.code.open .first { visibility: hidden; }
.code pre { display: none; margin: 0; padding: 0 12px 10px 34px; font: 400 12px/18px "Cascadia Mono", Consolas, monospace;
  white-space: pre; overflow-x: auto; color: var(--text); }
.code.open pre { display: block; animation: drop .18s var(--snap); }
/* a passage selected in the terminal, listed for the ":N" reply: marked where it stands */
mark { background: var(--hit); color: inherit; border-radius: 3px; box-shadow: 0 0 0 2px var(--hit); }
.qb { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; margin-right: 4px; border-radius: 4px;
  background: var(--blue); color: #fff; font: 700 11px/1 "Segoe UI", system-ui, sans-serif; vertical-align: 1px;
  font-variant-numeric: tabular-nums; }
/* the user's answer under a paragraph: their text in blue on a light blue ground with a blue rule; Claude's text is
   never touched. Empty, it is the place an answer goes, opened under a paragraph by a click on it */
.ansrow { margin: 2px 0 6px 22px; }
.ansrow.new { animation: drop .16s var(--snap); }
.ans { display: block; width: 100%; resize: none; overflow: hidden; min-height: 34px; padding: 5px 10px;
  border: 1px dashed #c3cdea; border-radius: var(--r-small); background: var(--panel); color: var(--blue);
  font: 400 14px/22px "Segoe UI", system-ui, sans-serif; outline: none; }
.ans::placeholder { color: var(--faint); }
.ans:focus, .ans.has { border: 0; border-left: 2px solid var(--blue); border-radius: 0 var(--r-small) var(--r-small) 0;
  background: var(--ans-bg); padding-left: 10px; }
.ans:focus { box-shadow: 0 0 0 3px rgba(27, 77, 245, .12); }
/* Space held in a box: Windows voice typing types into it; the line under the box says what is happening */
.ans.listening { border-left-color: var(--red); box-shadow: 0 0 0 3px rgba(225, 29, 72, .12); }
.vline { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--muted);
  font: 400 12px/16px "Segoe UI", system-ui, sans-serif; }
.vline.on::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.vline.note { color: #92400e; }
#empty { color: var(--muted); padding: 6px 0; }
#empty[hidden], #miss[hidden] { display: none; }
/* selections that are not in the reply text */
#miss { flex: none; padding: 6px 28px 6px var(--edge); border-top: 1px solid var(--line); color: var(--muted);
  font: 400 12px/18px "Segoe UI", system-ui, sans-serif; overflow-wrap: anywhere; }
#miss .qb { height: 16px; font-size: 10px; }
#foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px var(--edge); border-top: 1px solid var(--line); }
#count { color: var(--muted); font: 400 12px "Segoe UI", system-ui, sans-serif; white-space: nowrap; }
#count b { color: var(--text); font-weight: 600; }
#say { flex: 1; min-width: 0; font: 400 12px/16px "Segoe UI", system-ui, sans-serif; color: var(--green); }
#say.err { color: var(--red-deep); }
.b { min-height: 32px; padding: 0 14px; border-radius: var(--r-ctl); font: 600 12px "Segoe UI", system-ui, sans-serif;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: inline-flex; align-items: center;
  gap: 6px; flex: none; transition: transform .16s ease-out, background-color .12s, color .12s; }
.b:hover { color: var(--blue); border-color: var(--blue); }
.b.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(27, 77, 245, .3); }
.b.primary:hover { background: #1640d6; color: #fff; }
.b:active { transform: scale(.97); }
.b:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.b:disabled:hover { color: var(--muted); border-color: var(--line); }
.b.primary:disabled:hover { background: var(--blue); color: #fff; }
.b svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tip { position: fixed; z-index: 20; max-width: min(360px, calc(100vw - 8px)); padding: 5px 8px; border-radius: var(--r-small);
  background: var(--tip-bg); color: #fff; font: 400 11px/1.35 "Segoe UI", system-ui, sans-serif; white-space: pre-wrap;
  overflow-wrap: anywhere; pointer-events: none; box-shadow: var(--shadow-tip); animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="head"><div class="tabrow"><div class="tabs" id="tabs"></div><button type="button" id="fold" tabindex="-1"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 9l4-4 4 4"/></svg></button></div><div class="chips" id="chips"></div><div class="meta" id="meta"></div></div>
<div id="ask" role="alert" hidden></div>
<div id="body"><div id="empty" hidden></div><div id="replies"></div></div>
<div id="miss" hidden></div>
<div id="foot"><span id="count"></span><span id="say" role="status"></span>
  <button type="button" class="b" id="copy" data-tip="Copies the replies you answered, each with your answers inside it, to paste anywhere."><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/><path d="M9.5 2.5h-6a1 1 0 0 0-1 1v6"/></svg>Copy</button>
  <button type="button" class="b primary" id="send"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h9M7.5 3.5L11 7l-3.5 3.5"/></svg>Send to Session</button>
</div>
<script>
const api = () => window.pywebview.api;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const CHEV = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5L6.5 5 3 8.5"/></svg>';
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3H8v2h1v6l-3 3v2h5v6l1 1 1-1v-6h5v-2l-3-3V5h1z"/></svg>';
const X = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg>';
let S = null;          // what agent-panel.pyw sent last: {sid, name, replies, answers, selections, note, pins}
let view = null;       // the pin shown in place of the latest replies (its id); null: the latest
let shownSid = null;   // the session drawn now
let answers = {};      // paragraph key -> {text, passage}, the page's own copy of the session's draft
let shownKey = null;   // the replies drawn now (session and text), so an update with the same ones keeps the page
let ready = false;
const opened = new Set();  // paragraph keys whose answer box is open while empty (one with text is open anyway)

// ---------- Claude's markdown, as blocks; each answerable block keeps its own source text ----------
function blocks(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n"), out = [];
  // every block a box can answer carries last: the index of its last line in text's lines, where Send to Session
  // puts its answer (agent-reply.py answer_block())
  let i = 0, para = null, paraAt = 0;
  const flush = () => { if (para) { out.push({kind: "p", src: para.join("\n"), last: paraAt + para.length - 1}); para = null; } };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^ {0,3}(`{3,}|~{3,})\s*([\w+#.-]*)/);
    if (fence) {
      flush();
      const body = [];
      i++;
      while (i < lines.length && !(lines[i].trim().startsWith(fence[1]) && !lines[i].trim().slice(fence[1].length).trim())) body.push(lines[i++]);
      i++;
      out.push({kind: "code", lang: fence[2] || "", lines: body});
      continue;
    }
    if (!line.trim()) { flush(); i++; continue; }
    let m;
    if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/))) { flush(); out.push({kind: "h", level: m[1].length, src: line, text: m[2], last: i}); i++; continue; }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push({kind: "hr"}); i++; continue; }
    if (line.includes("|") && i + 1 < lines.length && SEP.test(lines[i + 1]) && lines[i + 1].includes("|")) {
      // a table (GFM): a header row, the row of dashes (colons set each column's alignment), then every
      // following line holding a "|"; the whole table is one paragraph, its source as Claude wrote it
      flush();
      const head = cells(line), align = cells(lines[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : /^:-/.test(c) ? "left" : "");
      const src = [line, lines[i + 1]], rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) { src.push(lines[i]); rows.push(cells(lines[i])); i++; }
      out.push({kind: "table", src: src.join("\n"), head, align, rows, last: i - 1});
      continue;
    }
    if (/^\s*\|/.test(line)) {  // lines that start with "|" but are no table: kept as written, in monospace
      flush();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push({kind: "pre", src: rows.join("\n"), last: i - 1});
      continue;
    }
    if ((m = line.match(/^\s*>\s?(.*)$/))) {
      flush();
      const rows = [];
      while (i < lines.length && (m = lines[i].match(/^\s*>\s?(.*)$/))) { rows.push(m[1]); i++; }
      out.push({kind: "quote", src: rows.map(r => "> " + r).join("\n"), text: rows.join("\n"), last: i - 1});
      continue;
    }
    if ((m = line.match(/^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/))) {
      flush();
      const src = [line], text = [m[3]], indent = m[1].length;
      i++;
      while (i < lines.length && lines[i].trim() && !/^(\s*)([-*+]|\d{1,3}[.)])\s+/.test(lines[i]) &&
             !/^ {0,3}(`{3,}|~{3,})/.test(lines[i]) && /^\s+/.test(lines[i])) { src.push(lines[i]); text.push(lines[i].trim()); i++; }
      out.push({kind: "li", src: src.join("\n"), marker: /\d/.test(m[2]) ? m[2] : "•", indent, text: text.join(" "), last: i - 1});
      continue;
    }
    if (!para) { para = []; paraAt = i; }
    para.push(line);
    i++;
  }
  flush();
  return out;
}

// a table row's cells: the outer pipes dropped, split at every "|" not escaped as "\|"
const SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function cells(row) {
  let r = row.trim();
  if (r.startsWith("|")) r = r.slice(1);
  if (r.endsWith("|") && !r.endsWith("\\|")) r = r.slice(0, -1);
  const out = [];
  let cur = "";
  for (let i = 0; i < r.length; i++) {
    if (r[i] === "\\" && r[i + 1] === "|") { cur += "|"; i++; }
    else if (r[i] === "|") { out.push(cur.trim()); cur = ""; }
    else cur += r[i];
  }
  out.push(cur.trim());
  return out;
}

// inline markdown: code, bold, italics, strikethrough, links (a markdown link and a bare web address, opened in the
// browser by a click); everything else stays as Claude wrote it
function inline(t) {
  const parts = String(t).split(/(`+)([\s\S]*?)\1/);
  let html = "";
  for (let k = 0; k < parts.length; k++) {
    if (k % 3 === 0) {
      html += esc(parts[k])
        .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<b>$1</b>")
        .replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?!\w)/g, "$1<i>$2</i>")
        .replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<s>$1</s>")
        .replace(/\[([^\]\n]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, '<a class="lnk" data-url="$2" data-tip="$2">$1</a>')
        .replace(/(^|[\s(]|&quot;)(https?:\/\/(?:(?!&quot;|&[lg]t;)[^\s<])*?)(?=[.,;:!?)']*(?:$|[\s<]|&quot;|&[lg]t;))/g, '$1<a class="lnk" data-url="$2" data-tip="$2">$2</a>');
    } else if (k % 3 === 2) {
      html += "<code>" + esc(parts[k]) + "</code>";
    }
  }
  return html;
}

function blockHtml(b, key) {
  const k = `data-key="${esc(key)}" data-tip="${paraTip(b.kind)}"`;
  if (b.kind === "code") {
    const first = b.lines.find(l => l.trim()) || "";
    const n = b.lines.length;
    return `<div class="code"><button type="button" data-tip="${n === 1 ? "Shows the line" : "Shows the " + n + " lines"}">${CHEV}<span class="k">${esc(b.lang || "code")}</span><span>${n} line${n === 1 ? "" : "s"}</span><span class="first">${esc(first.trim())}</span></button><pre>${esc(b.lines.join("\n"))}</pre></div>`;
  }
  if (b.kind === "hr") return '<div class="hr"></div>';
  if (b.kind === "h") return `<div class="para h${b.level <= 2 ? " h" + b.level : ""}" ${k}>${inline(b.text)}</div>`;
  if (b.kind === "table") {
    const al = j => b.align[j] ? ` style="text-align:${b.align[j]}"` : "";
    const row = (cs, tag) => "<tr>" + b.head.map((_, j) => `<${tag}${al(j)}>${inline(cs[j] || "")}</${tag}>`).join("") + "</tr>";
    return `<div class="para table" ${k}><table><thead>${row(b.head, "th")}</thead><tbody>${b.rows.map(r => row(r, "td")).join("")}</tbody></table></div>`;
  }
  if (b.kind === "pre") return `<div class="para pre" ${k}>${esc(b.src)}</div>`;
  if (b.kind === "quote") return `<div class="para quote" ${k}>${inline(b.text).replace(/\n/g, "<br>")}</div>`;
  if (b.kind === "li") return `<div class="para li" ${k} style="margin-left:${Math.min(b.indent, 8) * 6}px"><span class="n">${esc(b.marker)}</span><span>${inline(b.text)}</span></div>`;
  return `<div class="para" ${k}>${inline(b.src).replace(/\n/g, "<br>")}</div>`;
}

// ---------- a click on a paragraph and its answer box (pure, so tools/test-reply.py runs it in node) ----------
// c: own (the click's own target acts: a link, a code block, Pin, a ":N" badge, the box itself, or no paragraph),
// moved (the pointer went 4 px or more between press and release), selected (text is selected after it), detail
// (2 and more: part of a double click), box (the paragraph's box is open), text (the box holds text).
// Answers "open" (and focus it), "close", "focus" (a box holding text never closes on a click) or "" (nothing).
function clickAction(c) {
  if (c.own || c.moved || c.selected || c.detail > 1) return "";
  if (!c.box) return "open";
  return c.text ? "focus" : "close";
}
function paraTip(kind) {  // the hint of a block whose box is shut (an open box's block has none)
  return `Click to answer this ${kind === "table" ? "table" : kind === "li" ? "item" : "paragraph"}`;
}
// Tab and Shift+Tab in an answer box: the block whose box opens next, in reading order across the replies shown.
// n blocks, i the box's own block; answers the index to go to, or -1 at either end (the box is then only left).
function tabTarget(n, i, back) {
  const j = i + (back ? -1 : 1);
  return i >= 0 && j >= 0 && j < n ? j : -1;
}

// Space in an answer box: a tap types a space; held HOLD ms it starts Windows voice typing (Win+H, sent by the panel)
// until it comes up. st: null (Space up), "wait" (down, not yet a hold), "start" (asked the panel), "on" (listening),
// "note" (could not start; the note shows). ev: {type: "down" (plain Space; repeat: key repeat), "up", "timer" (HOLD
// passed), "key" (another key went down), "blur" (the box lost the keyboard)}. Answers {st, act}: act "timer" (start
// the HOLD timer), "space" (type one space), "start", "stop" or "". A Space key never types by itself: the space of a
// tap goes in when Space comes up, or at once when another key goes down first (fast typing rolls over), and key
// repeat never types.
const HOLD = 400;
function spaceRule(st, ev) {
  switch (ev.type) {
    case "down": return st === null && !ev.repeat ? {st: "wait", act: "timer"} : {st, act: ""};
    case "timer": return st === "wait" ? {st: "start", act: "start"} : {st, act: ""};
    case "key": return st === "wait" ? {st: null, act: "space"} : {st, act: ""};
    case "up": return {st: null, act: st === "wait" ? "space" : st === "start" || st === "on" ? "stop" : ""};
    case "blur": return {st: null, act: st === "start" || st === "on" ? "stop" : ""};
  }
  return {st, act: ""};
}

// Copy and Send to Session take every answer under what is shown, the same ones the bar counts, in the order their
// blocks stand: the page's answers, not the boxes in the page (one answered and not drawn open still goes).
// answers {key: {text}}, sources {key: passage} of the blocks shown, order [key, ...] as they stand, ends {key: the
// index of the block's last line in its reply} (agent-reply.py puts the answer after that line). Pure, so
// tools/test-reply.py runs it in node.
function sendList(answers, sources, order, ends) {
  const at = k => { const i = order.indexOf(k); return i < 0 ? order.length : i; };
  return Object.keys(answers).filter(k => k in sources && String(answers[k].text || "").trim())
    .sort((a, b) => at(a) - at(b))
    .map(key => ({key, passage: sources[key], text: answers[key].text, line: ends && key in ends ? ends[key] : -1}));
}

// ---------- drawing ----------
const sources = {};  // key -> the paragraph's source text
const ends = {};     // key -> the index of its last line in the reply's text (where Send to Session puts the answer)
function draw() {
  const list = $("replies");
  for (const k of Object.keys(sources)) delete sources[k];
  for (const k of Object.keys(ends)) delete ends[k];
  const reps = shownReplies(), pinned = new Set((S.pins || []).map(p => p.id));
  list.innerHTML = reps.map(r => {
    const bs = blocks(r.text), on = pinned.has(r.id);
    bs.forEach((b, n) => { if (b.src !== undefined) { sources[r.id + "#" + n] = b.src; ends[r.id + "#" + n] = b.last; } });
    const tip = on ? "Unpins this reply: its chip under the tabs goes" : "Keeps this reply as a chip under the tabs, after newer prompts and restarts";
    return `<div class="reply" data-id="${esc(r.id)}"><div class="rtop"><span class="when">${esc(r.when || "")}</span><button type="button" class="rpin${on ? " on" : ""}" aria-pressed="${on}" aria-label="Pin this reply" data-tip="${tip}">Pin</button></div>${bs.map((b, n) => blockHtml(b, r.id + "#" + n)).join("")}</div>`;
  }).join("");
  $("empty").hidden = !!reps.length;
  $("empty").textContent = reps.length ? "" : (S.note || "");
  for (const key of new Set([...opened, ...Object.keys(answers)])) {
    const p = list.querySelector(`.para[data-key="${CSS.escape(key)}"]`);
    if (p) openBox(p, answers[key] ? answers[key].text : undefined, false);
  }
  mark();
  count();
}

// The passages listed for the ":N" reply, marked where they stand in the replies; the rest listed at the bottom.
// The terminal shows the text without markdown's marks and wraps it, so both sides are compared with every run of
// whitespace as one space; failing that, with no whitespace at all.
function textNodes() {
  const out = [];
  const walk = document.createTreeWalker($("replies"), NodeFilter.SHOW_TEXT, {acceptNode: n =>
    n.parentElement.closest("pre, .code, .ansrow, .rtop, .qb") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  for (let n = walk.nextNode(); n; n = walk.nextNode()) out.push(n);
  return out;
}
function flatten(nodes, keepSpace) {
  let s = "", at = [], space = true, lastPara = null;
  for (const n of nodes) {
    const para = n.parentElement.closest("td, th, .para");
    if (para !== lastPara) { if (keepSpace && !space) { s += " "; at.push(null); space = true; } lastPara = para; }
    const t = n.nodeValue;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (/\s/.test(c)) {
        if (keepSpace && !space) { s += " "; at.push([n, i]); space = true; }
        continue;
      }
      s += c; at.push([n, i]); space = false;
    }
  }
  return {s, at};
}
const squash = (t, keepSpace) => keepSpace ? t.replace(/[`*\u2500-\u257f]/g, " ").replace(/\s+/g, " ").trim()
  : t.replace(/[`*\u2500-\u257f]/g, "").replace(/\s+/g, "");
function wrap(at, from, to, n) {
  // the range's characters, text node by text node, each run wrapped in a <mark>; the badge before the first
  const runs = [];
  for (let k = from; k < to; k++) {
    if (!at[k]) continue;
    const [node, i] = at[k], last = runs[runs.length - 1];
    if (last && last.node === node && last.end === i) last.end = i + 1;
    else runs.push({node, start: i, end: i + 1});
  }
  for (let r = runs.length - 1; r >= 0; r--) {
    const {node, start, end} = runs[r];
    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, end);
    const m = document.createElement("mark");
    range.surroundContents(m);
    if (r === 0) m.insertAdjacentHTML("beforebegin", `<span class="qb">:${n}</span>`);
  }
}
function mark() {
  document.querySelectorAll("#replies .qb").forEach(b => b.remove());
  document.querySelectorAll("#replies mark").forEach(m => m.replaceWith(...m.childNodes));
  $("replies").normalize();
  const missing = [];
  for (const sel of S.selections || []) {
    let done = false;
    for (const keep of [true, false]) {
      const {s, at} = flatten(textNodes(), keep);
      let want = squash(sel.text, keep).replace(/^[●⎿•\s]+/, "");
      if (want.length < 2) break;
      const k = s.indexOf(want);
      if (k >= 0) { wrap(at, k, k + want.length, sel.n); done = true; break; }
    }
    if (!done) missing.push(sel);
  }
  const miss = $("miss");
  miss.hidden = !missing.length;
  miss.innerHTML = missing.length ? "Not in these replies: " + missing.map(m => {
    const t = m.text.replace(/\s+/g, " ").trim();
    return `<span class="qb">:${m.n}</span>${esc(t.length > 60 ? t.slice(0, 60).trimEnd() + "…" : t)}`;
  }).join(" &nbsp; ") : "";
}

function count() {
  // the answers under what is shown now are the ones Copy and Send to Session take; those under another chip wait
  const all = Object.entries(answers).filter(([, a]) => a.text.trim()), s = (S && S.selections || []).length;
  const n = sendList(answers, sources, []).length, other = all.length - n;
  const parts = [n ? `<b>${n} answer${n === 1 ? "" : "s"}</b>` : "No answer yet"];
  if (other) parts.push(`${other} more under another chip`);
  if (s) parts.push(`${s} selection${s === 1 ? "" : "s"}`);
  if (all.length) parts.push("draft kept");
  $("count").innerHTML = parts.join(" · ");
  $("copy").disabled = $("send").disabled = !n;
  $("send").dataset.tip = S ? `Pastes the replies you answered, with your answers inside them, into the prompt of ${S.name}. Nothing is sent until you press Enter there.` : "";
  size();
}

// ---------- the answer box ----------
function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; size(); }
function kindOf(p) { return p.classList.contains("table") ? "table" : p.classList.contains("li") ? "li" : "para"; }
function openBox(p, text, animate) {
  let row = p.nextElementSibling;
  opened.add(p.dataset.key);
  if (!row || !row.classList.contains("ansrow")) {
    row = document.createElement("div");
    row.className = "ansrow" + (animate ? " new" : "");
    row.dataset.for = p.dataset.key;
    row.innerHTML = '<textarea class="ans" rows="1" placeholder="Type your answer, or hold Space to speak…" aria-label="Your answer to this paragraph. Hold Space to speak it."></textarea>';
    p.after(row);
  }
  const t = row.firstChild;
  if (text !== undefined) t.value = text;
  t.classList.toggle("has", !!t.value.trim());
  tipFor(p);
  grow(t);
  return t;
}
function closeBox(row) {  // only an empty box closes
  if (!row || row.firstChild.value.trim()) return;
  const p = row.previousElementSibling;
  opened.delete(row.dataset.for);
  row.remove();
  if (p) tipFor(p);
  size();
}
function tipFor(p) {  // the paragraph's tooltip says what a click does; none while its box is open
  const row = p.nextElementSibling;
  if (row && row.classList.contains("ansrow")) delete p.dataset.tip;
  else p.dataset.tip = paraTip(kindOf(p));
}
// ---------- Windows voice typing: Space held in a box (spaceRule() decides, the panel sends Win+H) ----------
let voiceBox = null, voiceSt = null, voiceTimer = 0, voiceQueue = Promise.resolve();
function vline(t, kind, text, link) {  // the line under a box: "" (none), "start", "on" or "note"; link: {text, uri},
  const row = t.parentElement;                // the Settings page the note names, its name made a link to it
  let l = row.querySelector(".vline");
  t.classList.toggle("listening", kind === "on");
  if (!kind) { if (l) { l.remove(); size(); } return; }
  if (!l) { l = document.createElement("div"); l.setAttribute("role", "status"); row.append(l); }
  l.className = "vline " + kind;
  const at = link ? text.indexOf(link.text) : -1, words = document.createElement("span");  // one flex item: wraps as text
  if (at < 0) words.textContent = text;
  else {
    const a = document.createElement("a");
    a.className = "lnk";
    a.dataset.settings = link.uri;
    a.dataset.tip = "Opens this page of Windows Settings";
    a.textContent = link.text;
    words.append(text.slice(0, at), a, text.slice(at + link.text.length));
  }
  l.replaceChildren(words);
  size();
}
// a press on a note's Settings link leaves the keyboard in its box: the box losing it would take the note, and the
// link with it, away before the click
document.addEventListener("mousedown", e => { if (e.target.closest(".vline a.lnk")) e.preventDefault(); }, true);
function voiceStep(t, ev) {
  const r = spaceRule(voiceSt, ev);
  voiceSt = r.st;
  voiceBox = r.st === null ? null : t;
  if (r.act === "timer") { clearTimeout(voiceTimer); voiceTimer = setTimeout(() => voiceStep(t, {type: "timer"}), HOLD); }
  else if (r.st !== "wait") clearTimeout(voiceTimer);  // key repeat while waiting keeps the timer
  if (r.act === "space") { t.focus(); document.execCommand("insertText", false, " "); }  // as typed: undo and input
  if (r.act === "start") {
    vline(t, "start", "Starting Windows voice typing…");
    voiceQueue = voiceQueue.then(() => api().voice(true)).then(a => {
      if (voiceBox !== t || voiceSt !== "start") return;  // let go meanwhile: the stop queued behind this ends it
      if (a && a.on) { voiceSt = "on"; vline(t, "on", "Listening… release Space to stop."); }
      else { voiceSt = "note"; vline(t, "note", (a && a.note) || "Windows voice typing did not start.", a && a.link); }
    }).catch(() => {});
  }
  if (r.act === "stop") {
    vline(t, "");
    voiceQueue = voiceQueue.then(() => api().voice(false)).catch(() => {});
  }
}
let saveJob = {};
function changed(t) {
  const key = t.parentElement.dataset.for;
  t.classList.toggle("has", !!t.value.trim());
  if (t.value.trim()) answers[key] = {text: t.value, passage: sources[key] || ""};
  else delete answers[key];
  if (t.parentElement.previousElementSibling) tipFor(t.parentElement.previousElementSibling);
  grow(t);
  count();
  clearTimeout(saveJob[key]);
  // the session, the passage and the text as typed now: a redraw before the save fires must not change where the
  // draft goes (S and sources belong to what is drawn when it fires)
  const sid = S.sid, passage = sources[key] || "", text = t.value;
  saveJob[key] = setTimeout(() => api().draft(sid, key, passage, text), 300);
}
document.addEventListener("input", e => { if (e.target.classList.contains("ans")) changed(e.target); });
document.addEventListener("keyup", e => {
  if (e.code === "Space" && voiceBox) voiceStep(voiceBox, {type: "up"});
});
addEventListener("blur", () => { if (voiceBox) voiceStep(voiceBox, {type: "blur"}); });  // the window lost the keyboard
document.addEventListener("focusout", e => {
  if (!e.target.classList.contains("ans")) return;
  if (voiceBox === e.target) voiceStep(e.target, {type: "blur"});
  vline(e.target, "");
  setTimeout(() => { if (pending && !typing()) { pending = false; flush(); } }, 0);  // Tab to the next box: still held
});
// Tab and Shift+Tab keep the box's text and open the next (previous) block's box with the caret in it, scrolled into
// view; a box left empty closes, so tabbing past blocks leaves no trail; at the last (first) block the box is only left.
function tabMove(t, back) {
  const row = t.parentElement, all = [...$("replies").querySelectorAll(".para")];
  const j = tabTarget(all.length, all.indexOf(row.previousElementSibling), back);
  if (j < 0) { t.blur(); closeBox(row); return; }
  const q = all[j], nt = openBox(q, undefined, true);
  nt.focus();
  nt.setSelectionRange(nt.value.length, nt.value.length);
  closeBox(row);
  q.scrollIntoView({block: "nearest"});
  nt.parentElement.scrollIntoView({block: "nearest"});
}
// Keys typed in an answer box stay in it: Enter and Esc finish the answer and leave the box (its text and draft kept,
// the focus goes nowhere, so no tab, chip or button is reached or pressed); Tab and Shift+Tab move between the blocks'
// boxes (tabMove()), never to another control; Shift+Enter is a new line; a plain Space goes to the voice typing rule.
// stopPropagation: no other handler sees them.
document.addEventListener("keydown", e => {
  sayClear();
  if (!e.target.classList.contains("ans")) return;
  e.stopPropagation();
  const plain = !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey;
  if (e.code === "Space" && plain && !e.isComposing) { e.preventDefault(); voiceStep(e.target, {type: "down", repeat: e.repeat}); return; }
  if (voiceBox === e.target && e.code !== "Space") voiceStep(e.target, {type: "key"});
  else if (!voiceBox) vline(e.target, "");  // a note from an earlier hold goes with the next key
  if (e.isComposing) return;  // an IME's Enter confirms its own text

}, true);

// a click (not a drag) on a paragraph opens its box or closes an empty one; where the press went down tells a drag
// that selects text (for copying or for the ":N" reply) apart from a click
let down = null;
document.getElementById("body").addEventListener("pointerdown", e => { down = {x: e.clientX, y: e.clientY}; }, true);
document.addEventListener("click", e => {
  const pb = e.target.closest(".rpin");
  if (pb) { pinDo(pb.classList.contains("on") ? "unpin" : "pin", pb.closest(".reply").dataset.id); return; }
  const sw = e.target.closest("#ask [data-swap]");
  if (sw) { pinDo("swap", sw.dataset.swap); return; }
  if (e.target.closest("#ask [data-cancel]")) { askHide(); return; }
  const a = e.target.closest("a.lnk");
  if (a && a.dataset.settings) { e.preventDefault(); tipHide(); api().settings(a.dataset.settings); return; }  // its box stays
  if (a) { e.preventDefault(); tipHide(); api().link(a.dataset.url); return; }
  const row = e.target.closest(".ansrow");
  if (row) { row.firstChild.focus(); return; }
  const hit = e.target.closest("#replies .para");
  if (hit && !e.target.closest(".qb, a.lnk")) {
    // the paragraph as drawn now: an update held while a box had the keyboard is drawn when the press leaves it
    const p = $("replies").querySelector(`.para[data-key="${CSS.escape(hit.dataset.key)}"]`);
    const next = p && p.nextElementSibling, box = next && next.classList.contains("ansrow") ? next : null;
    const sel = getSelection();
    const act = !p ? "" : clickAction({own: false, detail: e.detail, box: !!box, text: !!(box && box.firstChild.value.trim()),
      moved: !!down && Math.hypot(e.clientX - down.x, e.clientY - down.y) >= 4, selected: !!sel && !sel.isCollapsed});
    tipHide();
    if (act === "open") openBox(p, undefined, true).focus();
    else if (act === "close") closeBox(box);
    else if (act === "focus") box.firstChild.focus();
    return;
  }
  const code = e.target.closest(".code > button");
  if (code) {
    const c = code.parentElement, open = c.classList.toggle("open");
    const n = c.querySelector("pre").textContent.split("\n").length;
    code.dataset.tip = open ? "Hides the code" : (n === 1 ? "Shows the line" : "Shows the " + n + " lines");
    tipHide();
    size();
  }
});

// ---------- pins ----------
function shownReplies() {  // a pin's reply when its chip is chosen, else the replies since the last prompt
  const p = view && (S.pins || []).find(p => p.id === view);
  return p ? [{id: p.id, when: p.when, text: p.text}] : (S.replies || []);
}
function drawChips() {
  const pins = S.pins || [];
  $("chips").innerHTML = !pins.length ? "" : `<span class="chip${view ? "" : " on"}"><button type="button" class="go" tabindex="-1" data-view="" aria-pressed="${!view}" data-tip="Shows the replies since your last prompt"><span class="w">Latest</span></button></span>` +
    pins.map(p => {
      const on = view === p.id, first = p.text.trim().split("\n")[0];
      return `<span class="chip${on ? " on" : ""}"><button type="button" class="go" tabindex="-1" data-view="${esc(p.id)}" aria-pressed="${on}" data-tip="${esc("Shows this pinned reply: " + (first.length > 120 ? first.slice(0, 120) + "…" : first))}">${PIN}<span class="w">${esc(p.label)}</span>${p.when ? `<span class="at">${esc(p.when)}</span>` : ""}</button><button type="button" class="x" tabindex="-1" data-unpin="${esc(p.id)}" aria-label="Unpin ${esc(p.label)}" data-tip="Unpins this reply. Its chip and the text kept with it go">${X}</button></span>`;
    }).join("");
}
function showView(id) {
  if (view === (id || null)) return;
  view = id || null;
  tipHide();
  apply();
  $("body").scrollTop = 0;
}
function pinDo(mode, id) {
  const sid = S.sid, r = shownReplies().find(r => r.id === id);
  tipHide();
  api().pin(sid, id, r ? r.text : "", mode).then(res => {
    if (!res || !S || S.sid !== sid) return;
    if (res.err) { say(res.t, true); return; }
    S.pins = res.pins || [];
    if (res.full) askFull(id, res.full, S.pins.length);
    else askHide();
    apply();
  });
}
function askFull(id, oldest, n) {
  const words = `“${esc(oldest ? oldest.label : "")}”${oldest && oldest.when ? ` (${esc(oldest.when)})` : ""}`;
  $("ask").innerHTML = `<span class="q">A session keeps ${n} pins at most. Unpin the oldest, ${words}, and pin this one?</span>` +
    `<button type="button" class="b primary" data-swap="${esc(id)}" data-tip="Unpins ${words} and pins this reply in its place">Unpin Oldest and Pin</button>` +
    `<button type="button" class="b" data-cancel data-tip="Keeps the ${n} pins as they are">Cancel</button>`;
  $("ask").hidden = false;
  size();
}
function askHide() {
  if ($("ask").hidden) return;
  $("ask").hidden = true;
  $("ask").innerHTML = "";
  size();
}

// ---------- Copy and Send to Session ----------
function ordered() {
  return sendList(answers, sources, [...document.querySelectorAll("#replies .para")].map(p => p.dataset.key), ends);
}
let sayJob = null;
function say(t, err) {
  clearTimeout(sayJob);
  $("say").textContent = t || "";
  $("say").classList.toggle("err", !!err);
  if (t && !err) sayJob = setTimeout(() => say(""), 5000);
}
function sayClear() { if ($("say").classList.contains("err")) say(""); }
document.addEventListener("pointerdown", sayClear, true);
$("copy").addEventListener("click", () => {
  api().copy(S.sid, ordered()).then(ok => say(ok ? "Copied" : "Could not copy: another program holds the clipboard. Try again.", !ok));
});
$("send").addEventListener("click", () => {
  const sid = S.sid, list = ordered();
  if (!list.length) return;
  for (const k of Object.keys(saveJob)) clearTimeout(saveJob[k]);
  const b = $("send");
  b.disabled = true;
  say("Typing into " + S.name + "…");
  api().send(sid, list).then(r => {
    if (r && !r.err && S.sid === sid) {  // the answers sent go; those under another chip stay
      for (const a of list) { delete answers[a.key]; if (S.answers) delete S.answers[a.key]; }
      document.querySelectorAll("#replies .ansrow").forEach(row => {
        if (!list.some(a => a.key === row.dataset.for)) return;
        const p = row.previousElementSibling;
        opened.delete(row.dataset.for);
        row.remove();
        if (p) tipFor(p);
      });
    }
    say(r ? r.t : "", !r || r.err);
    count();
  });
});

// ---------- tooltip: as the panel's (mindmap tooltip.md) ----------
let tip = null, tipTarget = null, tipJob = null, tipEnd = null, tipDone = null, lx = -1, ly = -1;
function typing() { return !!document.activeElement && document.activeElement.classList.contains("ans"); }
function tipShow(el) {
  tipJob = null;
  if (!document.body.contains(el) || !el.dataset.tip) return;
  if (typing() && el.classList.contains("para")) return;  // no "Click to answer" hint while an answer box has the keyboard
  tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = el.dataset.tip;
  document.body.append(tip);
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.max(4, Math.min((r.left + r.right) / 2 - w / 2, innerWidth - w - 4));
  let y = r.top - 6 - h;  // above: nothing opens upward from these
  if (y < 4) y = Math.min(r.bottom + 6, innerHeight - h - 4);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  tipEnd = setTimeout(() => { tipDone = tipTarget; tipHide(); }, 3000);
}
function tipHide() {
  clearTimeout(tipJob); clearTimeout(tipEnd);
  tipJob = tipEnd = tipTarget = null;
  if (tip) { tip.remove(); tip = null; }
}
addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || (e.clientX === lx && e.clientY === ly)) return;
  lx = e.clientX; ly = e.clientY;
  const p = e.target.closest("[data-tip]");
  if (p !== tipDone) tipDone = null;
  if (p && p === tipTarget) return;
  tipHide();
  if (p && p !== tipDone) { tipTarget = p; tipJob = setTimeout(() => tipShow(p), 400); }
});
addEventListener("pointerdown", e => { tipDone = tipTarget || e.target.closest("[data-tip]"); tipHide(); }, true);
$("body").addEventListener("scroll", tipHide);
document.addEventListener("focusin", e => { if (e.target.classList.contains("ans") && tipTarget && tipTarget.classList.contains("para")) tipHide(); });
document.documentElement.addEventListener("mouseleave", tipHide);
addEventListener("blur", tipHide);

// ---------- size: the window grows with what it holds; agent-panel.pyw caps it at the screen ----------
let sizeJob = null, sent = 0;
function natural() {
  if (document.body.classList.contains("folded")) return Math.ceil($("head").offsetHeight);
  // the replies' own height, not #body's scrollHeight: that is never less than the window gives it, so a shorter
  // content (another session, a pinned reply) would leave the window as tall as before
  const cs = getComputedStyle($("body"));
  const body = $("replies").offsetHeight + ($("empty").hidden ? 0 : $("empty").offsetHeight) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  return Math.ceil($("head").offsetHeight + ($("ask").hidden ? 0 : $("ask").offsetHeight) + body +
    ($("miss").hidden ? 0 : $("miss").offsetHeight) + $("foot").offsetHeight);
}
function size() {
  if (sizeJob) return;
  sizeJob = requestAnimationFrame(() => {
    sizeJob = null;
    const h = natural();
    if (ready && h !== sent) { sent = h; api().size(h); }
  });
}

// ---------- from agent-panel.pyw ----------
// While an answer box has the keyboard nothing is redrawn, and what agent-panel.pyw sends meanwhile (another session
// shown: a prompt typed in another tab, another terminal brought forward) is held whole, S and the tabs included, until
// the box is left: the page goes on being the session drawn, so the answers typed meanwhile are saved, counted and
// sent as that session's. (Before 2026-11-23 S was swapped at once while only the redraw waited, so those answers were
// saved under the other session and were gone when this one was shown again.)
let pending = false, held = null, heldHead = null;
function flush() {
  if (heldHead) { const h = heldHead; heldHead = null; drawHead(h); }
  if (held) { S = held; held = null; }
  if (S) apply();
}
function apply() {
  if (typing()) { pending = true; return; }
  const same = S.sid === shownSid;
  if (!same) { view = null; askHide(); }  // another session: its latest replies
  if (view && !(S.pins || []).some(p => p.id === view)) view = null;  // the pin shown was unpinned
  drawChips();
  const key = JSON.stringify([S.sid, view, shownReplies().map(r => [r.id, r.text]), (S.pins || []).map(p => p.id)]);
  if (key !== shownKey) {
    shownKey = key;
    shownSid = S.sid;
    if (!same) { answers = {}; opened.clear(); tipHide(); say(""); $("body").scrollTop = 0; }
    for (const [k, a] of Object.entries(S.answers || {})) if (!answers[k]) answers[k] = {text: a.text, passage: a.passage};
    draw();
  } else {
    mark();
    count();
  }
}
window.reply = {
  // state: {sid, name, replies: [{id, when, text}], answers: {key: {text, passage}}, selections: [{n, text}], note,
  // pins: [{id, label, when, text}] in the order pinned}
  show(state) {
    if (typing() && S) { held = state; pending = true; return natural(); }
    S = state;
    apply();
    return natural();
  },
  // h: {tabs: [{sid, name, dot: "ask"/"work"/"open", when, on, full}], meta: {name, where, line}, open}; null: no
  // session is open (agent-panel.pyw hides the window then)
  head(h) {
    if (!h) return natural();
    // a head that shows another session waits with the state that goes with it (above); any other (the fold, the
    // dots, the times) is drawn at once
    const on = (h.tabs.find(t => t.on) || {}).sid;
    if (typing() && S && on && on !== S.sid) { heldHead = h; pending = true; return natural(); }
    heldHead = null;
    return drawHead(h);
  },
};
function drawHead(h) {
  $("tabs").innerHTML = h.tabs.map(t => `<button type="button" class="tab${t.on ? " on" : ""}" tabindex="-1" data-sid="${esc(t.sid)}" data-tip="${esc(t.full)}" aria-pressed="${t.on}"><span class="dot ${t.dot}" aria-hidden="true"></span><span class="nm">${esc(t.name)}</span>${t.when ? `<span class="at">${esc(t.when)}</span>` : ""}</button>`).join("");
  const f = $("fold");
  f.classList.toggle("shut", !h.open);
  f.dataset.tip = h.open ? "Folds the reply window to its tabs" : "Opens the reply window";
  f.setAttribute("aria-label", h.open ? "Fold the reply window" : "Open the reply window");
  $("meta").innerHTML = h.meta ? `<b>${esc(h.meta.name)}</b> · ${esc(h.meta.where)}${h.meta.line ? " · " + esc(h.meta.line) : ""}` : "";
  document.body.classList.toggle("folded", !h.open);
  tipHide();
  size();
  return natural();
}

// The head's buttons work by pointer alone, so they are out of the keyboard's order (tabindex -1): Tab never lands on
// a session tab, the fold button or a chip.
// A press on the head: agent-panel.pyw follows the pointer and moves the window (and the strip) once it has gone a
// few pixels. On release it says whether that happened; only a press released in place counts as a click.
let pressed = null;
$("head").addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  e.preventDefault();
  try { $("head").setPointerCapture(e.pointerId); } catch (_) {}
  pressed = {b: e.target.closest("button"), x: e.screenX, y: e.screenY, n: api().press()};
});
$("head").addEventListener("pointermove", e => {
  if (pressed && Math.hypot(e.screenX - pressed.x, e.screenY - pressed.y) >= 4) document.body.classList.add("moving");
});
$("head").addEventListener("pointerup", e => {
  if (!pressed || e.button !== 0) return;
  const {b, n} = pressed;
  pressed = null;
  n.then(id => api().release(id)).then(moved => {
    document.body.classList.remove("moving");
    if (moved || !b) return;
    // the head's press is cancelled, so the keyboard stays in an answer box being typed in: it is left first, so
    // what the press shows is drawn now (its draft is kept)
    if (b.id !== "fold" && document.activeElement && document.activeElement.classList.contains("ans")) document.activeElement.blur();
    if (b.classList.contains("tab")) {  // agent-panel.pyw shows it and sends the head again; its latest replies
      if (S && b.dataset.sid === S.sid) showView(null);
      api().tab(b.dataset.sid);
    }
    else if (b.id === "fold") api().fold();
    else if (b.classList.contains("go")) showView(b.dataset.view || null);
    else if (b.classList.contains("x")) pinDo("unpin", b.dataset.unpin);
  });
});
$("head").addEventListener("lostpointercapture", () => { pressed = null; document.body.classList.remove("moving"); });
addEventListener("pywebviewready", () => { ready = true; api().ready(); });
addEventListener("resize", size);
</script>
</body>
</html>
