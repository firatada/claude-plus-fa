  const m = areaMerge(done, rid, Math.min(...ns), Math.max(...ns));
  const text = m.from.map(k => answers[k] ? String(answers[k].text || "").trim() : "").filter(Boolean).join("\n\n");
  const lone = m.a === m.b && !text && bs[0].el.classList.contains("para") ? bs[0].el : null;
  const key = lone ? lone.dataset.key : m.key;
  for (const k of m.from) if (k !== key) dropArea(k);  // taken in
  let t;
  if (lone) {
    if (!ownRow(lone)) aopened.add(key);
    t = openBox(lone, undefined, true);
  } else {
    t = openAreaBox(key, text || undefined, true);
    const fs = t ? boxFiles(t.parentElement) : [];
    if (t && text && (!answers[key] || JSON.stringify([answers[key].text, answers[key].files || []]) !== JSON.stringify([t.value, fs]))) {
      answers[key] = {text: t.value, passage: sources[key], files: fs};
      api().draft(S.sid, key, sources[key], t.value, fs);
    }
  }
  if (!t) return null;
  count();
  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);
  t.parentElement.scrollIntoView({block: "nearest"});
  return t.parentElement;
}
function dropArea(k) {  // an area taken into another: its answer, draft and box go (its text lives on in the other)
  clearTimeout(saveJob[k]);
  if (answers[k]) { delete answers[k]; api().draft(S.sid, k, "", ""); }
  if (S && S.answers) delete S.answers[k];
  const row = $("replies").querySelector(`.ansrow.area[data-for="${CSS.escape(k)}"]`);
  if (row) unframe(row);
}
$("body").addEventListener("pointerdown", e => {
  const c = {button: e.button, ctl: !!e.target.closest("button, .ans, .ansrow"), detail: 1};
  c.scrollbar = !c.ctl && onScrollbar(e.target, e.clientX, e.clientY);
  if (areaPress(c) !== "area") return;
  if (typing()) document.activeElement.blur();  // as a press outside a box always did: the box is left
  apend = Object.assign({id: e.pointerId, c, cx: e.clientX, cy: e.clientY}, bodyPt(e.clientX, e.clientY));
});
// the click count comes with mousedown (a pointerdown's detail is 0): the second and third press of a double or
// triple click are the browser's (a word, a paragraph selected; Ctrl+C copies it). Any other press starts no text
// selection and clears one left from before (the click still comes, so a paragraph's box or a link opens as before)
$("body").addEventListener("mousedown", e => {
  if (!apend) return;
  if (areaPress(Object.assign({}, apend.c, {detail: e.detail})) !== "area") { apend = null; return; }
  e.preventDefault();
  getSelection().removeAllRanges();
});
addEventListener("pointermove", e => {
  if (apend && e.pointerId === apend.id) {
    if (!(e.buttons & 1)) { apend = null; return; }
    if (Math.hypot(e.clientX - apend.cx, e.clientY - apend.cy) < AREA_MOVE) return;
    const at = {x: apend.x, y: apend.y};
    apend = null;
    try { $("body").setPointerCapture(e.pointerId); } catch (_) {}
    adrag = {id: e.pointerId, at, cx: e.clientX, cy: e.clientY};
    document.body.classList.add("areaing", "drawing");
    getSelection().removeAllRanges();
    tipHide();
    areaCopied(null);
    areaTint(null);
  }
  if (adrag && e.pointerId === adrag.id) {
    adrag.cx = e.clientX;
    adrag.cy = e.clientY;
    areaFollow();
    if (!ascroll) ascroll = requestAnimationFrame(areaScroll);
  }
});
addEventListener("pointerup", e => {
  if (apend && e.pointerId === apend.id) apend = null;  // a click: the paragraph's own (clickAction())
  if (adrag && e.pointerId === adrag.id) areaEnd();
});
addEventListener("pointercancel", () => { if (adrag) areaClear(); apend = null; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && adrag) { e.preventDefault(); areaClear(); }
}, true);

// ---------- tooltip: as the panel's (mindmap tooltip.md) ----------
let tip = null, tipTarget = null, tipJob = null, tipEnd = null, tipDone = null, lx = -1, ly = -1;
function typing() { return !!document.activeElement && document.activeElement.classList.contains("ans"); }
function tipShow(el) {
  tipJob = null;
  if (!document.body.contains(el) || !el.dataset.tip) return;
  if (typing() && el.classList.contains("para")) return;  // no "Click to answer" hint while an answer box has the keyboard
  tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = el.dataset.tip;
  document.body.append(tip);
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.max(4, Math.min((r.left + r.right) / 2 - w / 2, innerWidth - w - 4));
  let y = r.top - 6 - h;  // above: nothing opens upward from these
  if (y < 4) y = Math.min(r.bottom + 6, innerHeight - h - 4);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  tipEnd = setTimeout(() => { tipDone = tipTarget; tipHide(); }, 3000);
}
function tipHide() {
  clearTimeout(tipJob); clearTimeout(tipEnd);
  tipJob = tipEnd = tipTarget = null;
  if (tip) { tip.remove(); tip = null; }
}
addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || (e.clientX === lx && e.clientY === ly)) return;
  lx = e.clientX; ly = e.clientY;
  const p = e.target.closest("[data-tip]");
  if (p !== tipDone) tipDone = null;
  if (p && p === tipTarget) return;
  tipHide();
  if (p && p !== tipDone) { tipTarget = p; tipJob = setTimeout(() => tipShow(p), 400); }
});
addEventListener("pointerdown", e => { tipDone = tipTarget || e.target.closest("[data-tip]"); tipHide(); }, true);
$("body").addEventListener("scroll", tipHide);
document.addEventListener("focusin", e => { if (e.target.classList.contains("ans") && tipTarget && tipTarget.classList.contains("para")) tipHide(); });
document.documentElement.addEventListener("mouseleave", tipHide);
addEventListener("blur", tipHide);

// ---------- size: the window grows with what it holds; agent-panel.pyw caps it at the screen ----------
let sizeJob = null, sent = 0, sentHead = 0;
function natural() {
  if (document.body.classList.contains("folded")) return Math.ceil($("head").offsetHeight);
  // the replies' own height, not #body's scrollHeight: that is never less than the window gives it, so a shorter
  // content (another session, a pinned reply) would leave the window as tall as before
  const cs = getComputedStyle($("body"));
  const body = $("replies").offsetHeight + ($("empty").hidden ? 0 : $("empty").offsetHeight) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  return Math.ceil($("head").offsetHeight + ($("ask").hidden ? 0 : $("ask").offsetHeight) + body +
    ($("miss").hidden ? 0 : $("miss").offsetHeight) + $("foot").offsetHeight);
}
function size() {
  if (sizeJob) return;
  sizeJob = requestAnimationFrame(() => {
    sizeJob = null;
    // with the head's own height: one row of the screenshot strip beside it is made exactly as tall
    const h = natural(), hh = Math.ceil($("head").offsetHeight);
    if (ready && (h !== sent || hh !== sentHead)) { sent = h; sentHead = hh; api().size(h, hh); }
  });
}

// ---------- from agent-panel.pyw ----------
// While an answer box has the keyboard (holdsUpdates(): the window has it too) nothing is redrawn, and what
// agent-panel.pyw sends meanwhile (another session shown: a prompt typed in another tab, another terminal brought
// forward) is held whole, S and the tabs included, until the box is left or another window comes to the front (the
// box keeps the focus then, the window does not): the page goes on being the session drawn, so the answers typed meanwhile are saved, counted and
// sent as that session's. (Before 2026-11-23 S was swapped at once while only the redraw waited, so those answers were
// saved under the other session and were gone when this one was shown again.)
let pending = false, held = null, heldHead = null;
function holding() { return holdsUpdates({box: typing(), focused: document.hasFocus(), dictating: !!rec || busy.size > 0}); }
function release() { setTimeout(() => { if (pending && !holding()) { pending = false; flush(); } }, 0); }
function flush() {
  if (heldHead) { const h = heldHead; heldHead = null; drawHead(h); }
  if (held) { S = held; held = null; }
  if (S) apply();
}
function apply() {
  if (holding()) { pending = true; return; }
  const same = S.sid === shownSid;
  if (!same) { view = null; askHide(); }  // another session: its latest replies
  if (view && !(S.pins || []).some(p => p.id === view)) view = null;  // the pin shown was unpinned
  quickSync(S.quick);
  drawChips();
  const key = JSON.stringify([S.sid, view, shownReplies().map(r => [r.id, r.text]), (S.pins || []).map(p => p.id)]);
  if (key !== shownKey) {
    shownKey = key;
    shownSid = S.sid;
    if (!same) { answers = {}; opened.clear(); tipHide(); say(""); $("body").scrollTop = 0; }
    for (const [k, a] of Object.entries(S.answers || {})) {
      if (answers[k]) continue;
      const text = withLegacy(a.text || "", a.files);
      answers[k] = {text, passage: a.passage, files: pathsIn(text)};
    }
    answers = keptAnswers(answers, S.answers || {}, new Set((S.replies || []).concat(S.pins || []).map(r => r.id)));
    draw();
  } else {
    mark();
    count();
  }
}
window.reply = {
  // state: {sid, name, replies: [{id, when, text}], answers: {key: {text, passage}}, selections: [{n, text}], note,
  // pins: [{id, label, when, text}] in the order pinned, quick: the quick answers' texts in order}
  show(state) {
    if (holding() && S) { held = state; pending = true; return natural(); }
    S = state;
    apply();
    return natural();
  },
  // h: {tabs: [{sid, name, dot: "ask"/"work"/"open", when, on, full}], meta: {name, where, line}, open}; null: no
  // session is open (agent-panel.pyw hides the window then)
  head(h) {
    if (!h) return natural();
    // a head that shows another session waits with the state that goes with it (above); any other (the fold, the
    // dots, the times) is drawn at once
    const on = (h.tabs.find(t => t.on) || {}).sid;
    if (holding() && S && on && on !== S.sid) { heldHead = h; pending = true; return natural(); }
    heldHead = null;
    return drawHead(h);
  },
};
function drawHead(h) {
  $("tabs").innerHTML = h.tabs.map(t => `<button type="button" class="tab${t.on ? " on" : ""}" tabindex="-1" data-sid="${esc(t.sid)}" data-tip="${esc(t.full)}" aria-pressed="${t.on}"><span class="nm">${esc(t.name).replace(/[_\-.\/\\]/g, "$&<wbr>")}</span><span class="sub"><span class="dot ${t.dot}" aria-hidden="true"></span>${t.when ? `<span class="at">${esc(t.when)}</span>` : ""}</span></button>`).join("");
  tabFit();
  const f = $("fold");
  f.classList.toggle("shut", !h.open);
  f.dataset.tip = h.open ? "Folds the reply window to its tabs" : "Opens the reply window";
  f.setAttribute("aria-label", h.open ? "Fold the reply window" : "Open the reply window");
  // the folder is a link: a click opens it in File Explorer (as a folder link in a reply opens); the name stays text
  $("meta").innerHTML = h.meta ? `<b>${esc(h.meta.name)}</b> · <a class="lnk" data-url="${esc(h.meta.where)}" data-tip="Opens this folder in File Explorer">${esc(h.meta.where)}</a>${h.meta.line ? " · " + esc(h.meta.line) : ""}` : "";
  document.body.classList.toggle("folded", !h.open);
  if (h.open) $("replies").querySelectorAll(".ansrow").forEach(r => { quickFit(r); grow(r.firstChild); });  // boxes drawn while folded had no width
  tipHide();
  size();
  return natural();
}

// The tabs share the row in equal columns, TAB_MIN to TAB_MAX wide; more than fit in one row wrap into another, so
// every open session keeps a tab. A tab's name is never cut while it can be read whole, and stays as large as it
// can: two lines at a size come before a smaller size on one line.
//   for each size from NAME_SIZES' largest down to its floor:
//     if the name fits on one line, or on two broken only at spaces and _ - . / \: keep it, done
//   for each size from the largest down: if it fits on two lines broken anywhere: keep it, done
//   otherwise: two lines at the floor, the rest cut with "…" (the whole name is in the tab's tooltip)
const TAB_MIN = 72, TAB_MAX = 168, TAB_GAP = 6, NAME_LINE = 13, NAME_SIZES = [12, 11, 10];
function tabFit() {
  const box = $("tabs"), tabs = [...box.children], w = box.clientWidth;
  if (!tabs.length || !w) return;
  const cols = Math.max(1, Math.min(tabs.length, Math.floor((w + TAB_GAP) / (TAB_MIN + TAB_GAP))));
  box.style.gridTemplateColumns = `repeat(${cols}, ${Math.min(TAB_MAX, Math.floor((w - TAB_GAP * (cols - 1)) / cols))}px)`;
  for (const t of tabs) nameFit(t.querySelector(".nm"));
}
function nameFit(nm) {
  const tries = NAME_SIZES.flatMap(px => [["", 1, px], ["two", 2, px]]).concat(NAME_SIZES.map(px => ["any", 2, px]));
  for (const [way, lines, px] of tries) {
    nm.className = "nm " + way;
    nm.style.fontSize = px + "px";
    if (nm.scrollWidth <= nm.clientWidth && nm.scrollHeight <= lines * NAME_LINE + 1) return;
  }
  nm.className = "nm cut";
}
new ResizeObserver(() => { tabFit(); size(); }).observe($("tabs"));
new ResizeObserver(size).observe($("head"));  // pins or a wrapped tab row change the head's height

// The head's buttons work by pointer alone, so they are out of the keyboard's order (tabindex -1): Tab never lands on
// a session tab, the fold button or a chip.
// A press on the head: agent-panel.pyw follows the pointer and moves the window (and the strip) once it has gone a
// few pixels. On release it says whether that happened; only a press released in place counts as a click.
let pressed = null;
$("head").addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  e.preventDefault();
  try { $("head").setPointerCapture(e.pointerId); } catch (_) {}
  pressed = {b: e.target.closest("button, a.lnk"), x: e.screenX, y: e.screenY, n: api().press()};
});
$("head").addEventListener("pointermove", e => {
  if (pressed && Math.hypot(e.screenX - pressed.x, e.screenY - pressed.y) >= 4) document.body.classList.add("moving");
});
$("head").addEventListener("pointerup", e => {
  if (!pressed || e.button !== 0) return;
  const {b, n} = pressed;
  pressed = null;
  n.then(id => api().release(id)).then(moved => {
    document.body.classList.remove("moving");
    if (moved || !b) return;
    if (b.matches("a.lnk")) { openLink(b); return; }  // the folder: the window, its tab and any answer box stay as they are
    // the head's press is cancelled, so the keyboard stays in an answer box being typed in: it is left first, so
    // what the press shows is drawn now (its draft is kept)
    if (b.id !== "fold" && document.activeElement && document.activeElement.classList.contains("ans")) document.activeElement.blur();
    if (b.classList.contains("tab")) {  // agent-panel.pyw shows it and sends the head again; its latest replies
      if (S && b.dataset.sid === S.sid) showView(null);
      api().tab(b.dataset.sid);
    }
    else if (b.id === "fold") api().fold();
    else if (b.classList.contains("go")) showView(b.dataset.view || null);
    else if (b.classList.contains("x")) pinDo("unpin", b.dataset.unpin);
  });
});
$("head").addEventListener("lostpointercapture", () => { pressed = null; document.body.classList.remove("moving"); });

// The grips (the right edge, the bottom, their corner): a press hands the side to agent-panel.pyw, which follows the
// pointer and sizes the window until the button is let go, the strip's full row keeping its width; the cursor stays the
// resize cursor meanwhile. Nothing else hears the press (no area drag, no tooltip, the keyboard stays put). A double
// click forgets that size: the width goes back to its default, the height follows the content again.
for (const g of document.querySelectorAll(".grip")) {
  g.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    try { g.setPointerCapture(e.pointerId); } catch (_) {}
    tipHide();
    document.body.classList.add("sizing-" + g.dataset.edge);
    api().resize(g.dataset.edge);
  });
  const done = () => document.body.classList.remove("sizing-r", "sizing-b", "sizing-rb");
  g.addEventListener("pointerup", done);
  g.addEventListener("lostpointercapture", done);
  g.addEventListener("dblclick", e => { e.preventDefault(); api().unsize(g.dataset.edge); });
}
addEventListener("pywebviewready", () => { ready = true; api().ready(); });
addEventListener("resize", size);
</script>
